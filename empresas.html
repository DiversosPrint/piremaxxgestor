<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empresas | Piremaxx Gestor</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0f4;color:#536878;font:14px Arial}.page{max-width:850px;margin:30px auto;background:#fff;border:1px solid #dce0e2;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;margin-bottom:22px}.head h1{font-weight:normal}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:#f1f2f3;padding:18px}.form label{display:flex;flex-direction:column;gap:6px}.wide{grid-column:1/-1}.form input{height:36px;border:1px solid #c8d0d5;padding:8px}.button{border:0;border-radius:4px;background:#2ca661;color:#fff;padding:10px 16px;cursor:pointer}.table{width:100%;border-collapse:collapse;margin-top:25px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #ddd}.empty{color:#83919a}@media(max-width:650px){.page{margin:0;padding:15px}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="page"><div class="head"><h1>Cadastro de empresas</h1><a href="index.html">Voltar</a></div><form id="form" class="form"><label>Razão social<input id="name" value="Piremaxx Pneus" required></label><label>Nome fantasia<input id="trade" value="Piremaxx Pneus" required></label><label>CNPJ / CPF<input id="doc"></label><label>Telefone<input id="phone"></label><label class="wide">Endereço<input id="address"></label><div class="wide"><button class="button">Salvar empresa</button></div></form><p id="message"></p><table class="table"><thead><tr><th>Empresa</th><th>CNPJ / CPF</th><th>Telefone</th></tr></thead><tbody id="rows"></tbody></table></main><script>const key='piremaxx.companies';const $=id=>document.getElementById(id);const read=()=>JSON.parse(localStorage.getItem(key)||'[]');function render(){const data=read();$('rows').innerHTML=data.length?data.map(x=>`<tr><td>${x.name}<br><small>${x.trade}</small></td><td>${x.doc||'-'}</td><td>${x.phone||'-'}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">Nenhuma empresa cadastrada.</td></tr>'}$('form').onsubmit=e=>{e.preventDefault();const data=read();data.push({name:$('name').value,trade:$('trade').value,doc:$('doc').value,phone:$('phone').value,address:$('address').value});localStorage.setItem(key,JSON.stringify(data));$('message').textContent='Empresa salva com sucesso.';render()};render();</script></body></html>
