<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar — Gestão Piremaxx</title>
  <link rel="stylesheet" href="styles.css?v=fixed-layout">
  <style>
    * { box-sizing: border-box; }
    :root { --login-blue: #132e68; --login-ink: #172c5b; --login-surface: #e7edf9; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #071432 url('public/images/login-background.jpg') center center / cover no-repeat fixed;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--login-ink);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: clamp(18px, 5vw, 56px) clamp(18px, 7vw, 9%);
      position: relative;
      overflow-x: hidden;
    }
    body::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(3, 18, 55, .08), rgba(3, 18, 55, .18)); pointer-events: none; }
    .login-shell {
      position: relative;
      z-index: 1;
      width: min(100%, 650px);
      max-height: calc(100vh - 36px);
      overflow: auto;
      background: var(--login-surface);
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: 22px 24px 38px rgba(2, 14, 42, .42), -10px -10px 24px rgba(255,255,255,.24), inset 2px 2px 5px rgba(255,255,255,.85), inset -4px -4px 9px rgba(113, 137, 183, .22);
    }
    .login-brand-bar { padding: 38px 42px 8px; display: flex; align-items: center; justify-content: center; }
    .login-brand-bar img.logo-main, .login-brand-divider, .login-brand-bar img.logo-sub { display: none; }
    .login-brand-bar::after { content: ''; display: block; width: min(100%, 430px); height: 76px; background-image: url('public/images/logo-oficial-2.png'); background-repeat: no-repeat; background-position: center center; background-size: auto 260px; }
    .login-body { padding: 4px clamp(32px, 6vw, 74px) 48px; }
    .login-body h1 { font-size: clamp(29px, 4vw, 43px); color: var(--login-blue); text-align: center; font-weight: 800; margin: 18px 0 10px; }
    .login-subtitle { font-size: clamp(16px, 2vw, 21px); color: var(--login-ink); text-align: center; margin: 0 0 8px; }
    .login-body::before { content: 'Faça login com suas credenciais'; display: block; text-align: center; color: #77839c; font-size: clamp(15px, 2vw, 19px); margin: 0 0 42px; }
    .login-alert {
      display: none;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .login-alert.error {
      display: block;
      background: #fdeaea;
      border: 1px solid #f2b8b8;
      color: #b92d2d;
    }
    .login-alert.success {
      display: block;
      background: #e7f8ef;
      border: 1px solid #a9e2c2;
      color: #1f7d4c;
    }
    .login-field {
      margin-bottom: 22px;
    }
    .login-field label {
      display: block;
      font-size: 18px;
      font-weight: 500;
      color: var(--login-ink);
      margin-bottom: 10px;
    }
    .login-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .login-field-icon { position: absolute; left: 24px; z-index: 1; color: #2f4779; display: inline-flex; pointer-events: none; }
    .login-field-icon svg { width: 28px; height: 28px; }
    .login-input-wrap input {
      width: 100%;
      height: 76px;
      border: 0;
      border-radius: 22px;
      padding: 0 58px 0 70px;
      font-size: 20px;
      color: var(--login-ink);
      background: var(--login-surface);
      box-shadow: inset 7px 7px 13px rgba(157, 174, 207, .52), inset -8px -8px 14px rgba(255,255,255,.9), 2px 2px 4px rgba(255,255,255,.5);
      transition: box-shadow .2s, transform .2s;
    }
    .login-input-wrap input:focus {
      outline: none;
      box-shadow: inset 4px 4px 9px rgba(157, 174, 207, .55), inset -5px -5px 11px rgba(255,255,255,.95), 0 0 0 3px rgba(46, 88, 164, .13);
    }
    .toggle-pass {
      position: absolute;
      right: 14px;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #4d628a;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .toggle-pass svg {
      width: 26px;
      height: 26px;
      pointer-events: none;
    }
    .toggle-pass:hover {
      background: rgba(255,255,255,.45);
      color: var(--login-blue);
    }
    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      margin: 10px 4px 24px;
    }
    .login-options label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #536789;
      cursor: pointer;
    }
    .login-options a {
      color: var(--login-blue);
      text-decoration: none;
    }
    .login-options a:hover {
      text-decoration: underline;
    }
    .login-submit {
      width: 100%;
      height: 72px;
      border: 0;
      border-radius: 38px;
      background: linear-gradient(145deg, #2f5798, #102b63);
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 8px 8px 14px rgba(114, 137, 180, .55), -5px -5px 10px rgba(255,255,255,.62), inset 1px 1px 1px rgba(255,255,255,.22);
      transition: transform .15s, box-shadow .15s, background .15s;
    }
    .login-submit:hover {
      background: linear-gradient(145deg, #3c68ae, #163774);
      transform: translateY(-1px);
    }
    .login-quick-box {
      display: none;
      padding-top: 14px;
      border-top: 1px solid #e6ecef;
    }
    .login-quick-box small {
      display: block;
      font-size: 11px;
      color: #7c909a;
      margin-bottom: 8px;
      text-align: center;
    }
    .login-quick-Chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .login-chip {
      border: 1px solid #d3dde2;
      background: #f5f8f9;
      color: #496572;
      border-radius: 14px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .login-chip:hover {
      background: #e4f3f2;
      border-color: #209b98;
      color: #197a77;
    }
    .login-chip b {
      color: #263840;
    }
    .login-footer { margin: 42px auto 0; max-width: 360px; text-align: center; color: var(--login-ink); font-size: 18px; line-height: 1.45; }
    @media (max-width: 760px) {
      body { justify-content: center; background-position: 42% center; padding: 14px; }
      .login-shell { max-height: calc(100vh - 28px); border-radius: 24px; }
      .login-brand-bar { padding-top: 28px; }
      .login-brand-bar::after { height: 62px; background-size: auto 220px; }
      .login-body { padding-left: 28px; padding-right: 28px; }
      .login-body h1 { font-size: 30px; }
      .login-subtitle { font-size: 15px; }
      .login-input-wrap input { height: 62px; font-size: 17px; }
      .login-submit { height: 62px; font-size: 19px; }
    }
    @media (min-width: 761px) and (max-height: 900px) {
      body { padding-top: 18px; padding-bottom: 18px; }
      .login-shell { max-height: calc(100vh - 24px); }
      .login-brand-bar { padding-top: 24px; padding-bottom: 2px; }
      .login-brand-bar::after { height: 58px; background-size: auto 210px; }
      .login-body { padding-bottom: 24px; }
      .login-body::before { margin-bottom: 24px; }
      .login-body h1 { margin-top: 10px; margin-bottom: 6px; }
      .login-field { margin-bottom: 14px; }
      .login-input-wrap input { height: 60px; }
      .login-submit { height: 60px; }
      .login-footer { margin-top: 22px; font-size: 16px; }
    }
  </style>
<link rel="stylesheet" href="mobile.css">
<style id="login-responsive-overrides">
  .pwa-bottom-nav, .mobile-menu-toggle, .mobile-menu-backdrop { display: none !important; }
  @media (max-width: 768px) {
    html, body { min-height: 100vh !important; height: 100% !important; }
    body { display: flex !important; align-items: center !important; justify-content: center !important; padding: 14px !important; font-size: 16px !important; }
  }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#132e68">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="public/images/icone%20pwa.png">
<script src="pwa.js" defer></script>
</head>
<body>
  <div class="login-shell">
    <div class="login-brand-bar">
      <img class="logo-main" src="public/logo.webp" alt="Piremaxx">
      <span class="login-brand-divider"></span>
      <img class="logo-sub" src="public/logo.png" alt="Gestão">
    </div>
    <form class="login-body" id="loginForm" autocomplete="on">
      <h1>Acesse sua conta</h1>
      <p class="login-subtitle">Portal do Colaborador - Acesso Seguro</p>
      <div id="loginAlert" class="login-alert"></div>
      <div class="login-field">
        <label for="loginUser">Usuário ou E-mail</label>
        <div class="login-input-wrap">
          <span class="login-field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.7-3.2 3-5 7-5s6.3 1.8 7 5"/></svg></span>
          <input id="loginUser" name="username" value="odiman" placeholder="Digite seu login ou e-mail" autocomplete="username" required>
        </div>
      </div>
      <div class="login-field">
        <label for="loginPass">Senha</label>
        <div class="login-input-wrap">
          <span class="login-field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
          <input id="loginPass" name="password" type="password" value="123456" placeholder="Digite sua senha" autocomplete="current-password" required>
          <button type="button" class="toggle-pass" id="togglePassBtn" title="Mostrar senha" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="login-options">
        <label><input type="checkbox" id="rememberUser" checked> Manter conectado</label>
        <a href="#" id="forgotPassLink">Esqueci minha senha</a>
      </div>
      <button type="submit" class="login-submit">Entrar no sistema</button>
      <p class="login-footer">Sistema de gestão empresarial -<br>Uso Exclusivo - Piremaxx Pneus</p>
      <div class="login-quick-box">
        <small>Acesso rápido por usuário cadastrado (senha padrão: <b>123456</b>):</small>
        <div class="login-quick-Chips" id="quickUsersList"></div>
      </div>
    </form>
  </div>

  <script>
    (function(){
      var DEFAULT_USERS = [
        {
          id: 5,
          nome: 'ODIMAN COSTA',
          email: 'adoraroro@gmail.com',
          login: 'odiman',
          senha: '123456',
          palavrasChave: 'ODIMAN COSTA ADMIN',
          perfil: 'admin',
          permissaoLabel: 'Administrador (Acesso completo)',
          ativo: true,
          permissoes: {
            home: true, financeiro: true, vendas: true, compras: true,
            frota: true, clientes: true, produtos: true, relatorios: true,
            configuracoes: true, excluir: true, descontos: true, custos: true
          }
        },
        {
          id: 1,
          nome: 'Diego Miranda',
          email: 'diego.miranda@piremaxx.com.br',
          login: 'diego',
          senha: '123456',
          palavrasChave: 'DIEGO COMERCIAL',
          perfil: 'comercial',
          permissaoLabel: 'Acesso completo',
          ativo: true,
          permissoes: {
            home: true, financeiro: true, vendas: true, compras: true,
            frota: true, clientes: true, produtos: true, relatorios: true,
            configuracoes: false, excluir: true, descontos: true, custos: true
          }
        },
        {
          id: 2,
          nome: 'Katia Maria',
          email: 'katia.castilho@piremaxx.com.br',
          login: 'katiacastilho',
          senha: '123456',
          palavrasChave: 'KATIA CASTILHO',
          perfil: 'financeiro',
          permissaoLabel: 'Acesso completo',
          ativo: true,
          permissoes: {
            home: true, financeiro: true, vendas: true, compras: true,
            frota: true, clientes: true, produtos: true, relatorios: true,
            configuracoes: false, excluir: true, descontos: true, custos: true
          }
        },
        {
          id: 3,
          nome: 'Viviane Martins',
          email: 'administrativo@piremaxx.com.br',
          login: 'vivianemartins',
          senha: '123456',
          palavrasChave: 'viviane administrativo',
          perfil: 'admin',
          permissaoLabel: 'Acesso completo',
          ativo: true,
          permissoes: {
            home: true, financeiro: true, vendas: true, compras: true,
            frota: true, clientes: true, produtos: true, relatorios: true,
            configuracoes: true, excluir: true, descontos: true, custos: true
          }
        },
        {
          id: 4,
          nome: 'CLAUDEMIR NOGUEIRA',
          email: 'claudemir.nogueira@piremaxx.com.br',
          login: 'claudemirnogueira',
          senha: '123456',
          palavrasChave: 'claudemir nogueira',
          perfil: 'comercial',
          permissaoLabel: 'Acesso completo',
          ativo: true,
          permissoes: {
            home: true, financeiro: true, vendas: true, compras: true,
            frota: true, clientes: true, produtos: true, relatorios: true,
            configuracoes: false, excluir: false, descontos: true, custos: false
          }
        }
      ];

      function getUsers(){
        try {
          var saved = JSON.parse(localStorage.getItem('piremaxx_usuarios') || 'null');
          if (Array.isArray(saved) && saved.length) return saved;
        } catch(e) {}
        localStorage.setItem('piremaxx_usuarios', JSON.stringify(DEFAULT_USERS));
        return DEFAULT_USERS;
      }

      var users = getUsers();
      var userInput = document.getElementById('loginUser');
      var passInput = document.getElementById('loginPass');
      var alertBox = document.getElementById('loginAlert');
      var quickList = document.getElementById('quickUsersList');

      function showMessage(msg, type){
        alertBox.textContent = msg;
        alertBox.className = 'login-alert ' + (type || 'error');
      }

      // Render quick login chips
      if (quickList) {
        quickList.innerHTML = users.filter(function(u){ return u.ativo !== false; }).map(function(u){
          var tag = u.perfil === 'admin' ? 'Admin' : 'Usuário';
          return '<button type="button" class="login-chip" data-login="' + u.login + '"><b>' + u.login + '</b> · ' + tag + '</button>';
        }).join('');
        quickList.addEventListener('click', function(e){
          var btn = e.target.closest('.login-chip');
          if (!btn) return;
          var found = users.find(function(u){ return u.login === btn.dataset.login; });
          if (found) {
            userInput.value = found.login;
            passInput.value = found.senha || '123456';
            alertBox.className = 'login-alert';
          }
        });
      }

      var EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
      var EYE_CLOSED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

      document.getElementById('togglePassBtn').addEventListener('click', function(){
        var isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        this.innerHTML = isPass ? EYE_CLOSED : EYE_OPEN;
        this.title = isPass ? 'Ocultar senha' : 'Mostrar senha';
        passInput.focus();
      });

      document.getElementById('forgotPassLink').addEventListener('click', function(e){
        e.preventDefault();
        showMessage('Solicite ao administrador (odiman) a redefinição da sua senha em Configurações > Usuários.', 'success');
      });

      function firstAllowedPage(u){
        var p = u.permissoes || {};
        if (u.perfil === 'admin' || p.home !== false) return 'index.html';
        if (p.vendas) return 'vendas.html';
        if (p.financeiro) return 'financeiro.html';
        if (p.compras) return 'compras.html';
        if (p.frota) return 'frota.html';
        if (p.clientes) return 'clientes.html';
        if (p.produtos) return 'produtos.html';
        if (p.relatorios) return 'relatorios.html';
        return 'index.html';
      }

      document.getElementById('loginForm').addEventListener('submit', function(e){
        e.preventDefault();
        users = getUsers();
        var rawLogin = (userInput.value || '').trim().toLowerCase().replace(/\s+/g, '');
        var rawPass = (passInput.value || '').trim();
        var matched = users.find(function(u){
          return String(u.login || '').toLowerCase().replace(/\s+/g, '') === rawLogin ||
                 String(u.email || '').toLowerCase().trim() === rawLogin ||
                 String(u.nome || '').toLowerCase().replace(/\s+/g, '') === rawLogin;
        });

        if (!matched) {
          showMessage('Usuário não encontrado. Verifique o login ou e-mail informado.', 'error');
          return;
        }
        if (matched.ativo === false) {
          showMessage('O acesso deste usuário está bloqueado pelo administrador.', 'error');
          return;
        }
        var expectedPass = String(matched.senha || '123456');
        if (rawPass !== expectedPass && !(rawLogin === 'odiman' && rawPass === '123456789')) {
          showMessage('Senha incorreta. Tente novamente.', 'error');
          return;
        }

        var session = {
          id: matched.id,
          nome: matched.nome,
          email: matched.email,
          login: matched.login,
          perfil: matched.perfil || 'comercial',
          permissaoLabel: matched.permissaoLabel || 'Acesso completo',
          permissoes: matched.permissoes || {},
          loggedAt: new Date().toISOString()
        };
        localStorage.setItem('piremaxx_sessao', JSON.stringify(session));

        // Registra no histórico de auditoria
        try {
          var audit = JSON.parse(localStorage.getItem('piremaxx_auditoria') || '[]');
          var now = new Date();
          var pad = function(n){ return String(n).padStart(2, '0'); };
          audit.unshift({
            id: 'aud-' + Date.now(),
            timestamp: now.getTime(),
            dateStr: pad(now.getDate()) + '/' + pad(now.getMonth() + 1) + '/' + now.getFullYear() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
            user: matched.login,
            module: 'Segurança',
            action: 'Realizou login no sistema',
            detail: matched.nome + ' (' + (matched.perfil === 'admin' ? 'Administrador' : 'Usuário') + ')',
            value: ''
          });
          localStorage.setItem('piremaxx_auditoria', JSON.stringify(audit.slice(0, 80)));
        } catch(err) {}

        location.href = firstAllowedPage(matched);
      });
    })();
  </script>
</body>
</html>
