+<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061b3d">
  <title>Acesso | Piremaxx Gestor</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root{color-scheme:dark;--blue:#168dff;--line:#5d9ada;--muted:#b3d0f6;--panel:#031d43e8}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body.login-page{min-height:100svh;display:flex;align-items:center;background:#061b3d url("login-bg-pc.png") center center/contain no-repeat;color:#fff;overflow:auto}
    .login-card{width:min(580px,calc(100vw - 72px));margin-left:clamp(54px,6vw,112px);padding:38px 58px 34px;border:1px solid #50b8ff;border-radius:30px;background:var(--panel);box-shadow:0 0 18px #159bff, inset 0 0 30px #062c58;backdrop-filter:blur(7px)}
    .brand-mark{display:block;width:min(390px,100%);height:auto;margin:0 auto 22px;object-fit:contain}
    .login-card h1{margin:0;text-align:center;font-size:45px;line-height:1.08;letter-spacing:-1.5px}
    .login-card h1 span{color:#3f9dff}
    .subtitle{margin:10px 0 30px;color:#abd0fa;text-align:center;font-size:20px}
    .field{position:relative;margin-top:16px}
    .field svg{position:absolute;left:25px;top:50%;width:28px;height:28px;transform:translateY(-50%);stroke:#afd2ff;fill:none;stroke-width:1.8}
    .field input{width:100%;height:66px;padding:0 58px 0 82px;border:1px solid var(--line);border-radius:17px;background:#0b2d5ae8;color:#fff;font-size:20px;outline:none}
    .field input::placeholder{color:#a7c6ee}
    .field input:focus{border-color:#72c2ff;box-shadow:0 0 0 3px #169cff36}
    .toggle-password{position:absolute;right:18px;top:50%;width:40px;height:40px;transform:translateY(-50%);border:0;background:transparent;color:#b9d7ff;font-size:25px;cursor:pointer}
    .submit{width:100%;height:64px;margin-top:26px;border:1px solid #61d1ff;border-radius:17px;background:linear-gradient(100deg,#1086ff,#0870f1);color:#fff;font-size:27px;font-weight:bold;cursor:pointer;box-shadow:inset 0 0 12px #83d5ff55}
    .submit:hover{filter:brightness(1.12)}
    .login-options{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 0;color:#d4e6ff;font-size:14px}
    .remember{display:flex;align-items:center;gap:10px;cursor:pointer}
    .remember input{appearance:none;width:22px;height:22px;margin:0;border:1px solid #a7ceff;border-radius:4px;background:#082653}
    .remember input:checked{background:#168dff;box-shadow:inset 0 0 0 4px #082653}
    .forgot{border:0;background:transparent;color:#d4e6ff;cursor:pointer;font-size:14px}
    .forgot:hover{text-decoration:underline}
    .features{display:grid;grid-template-columns:repeat(3,1fr);margin-top:34px;padding-top:23px;border-top:1px solid #2c6da9}
    .feature{min-height:73px;padding:0 14px;text-align:center;border-right:1px solid #2c6da9;color:#fff}
    .feature:last-child{border-right:0}
    .feature svg{width:34px;height:34px;margin-bottom:7px;stroke:#68aeff;fill:none;stroke-width:1.6}
    .feature strong{display:block;font-size:15px;font-weight:normal;line-height:1.15}
    .slogan{margin:29px 0 0;padding-top:22px;border-top:1px solid #2c6da9;text-align:center;color:#a9d1fa;font-size:16px;letter-spacing:5px;line-height:1.55}
    .slogan::before{content:"";display:block;width:70px;height:5px;margin:0 auto 20px;border-radius:4px;background:#149cff}
    .message{display:none;margin-top:14px;padding:10px;border:1px solid #ff7890;border-radius:8px;background:#501529cc;color:#ffd9df;text-align:center;font-size:13px}
    .message.show{display:block}
    @media(max-width:700px){
      body.login-page{align-items:flex-start;justify-content:center;padding:154px 15px 35px;background-image:url("login-bg-pwa.png");background-position:center top;background-size:contain;background-repeat:no-repeat}
      .login-card{width:min(100%,390px);margin:0;padding:22px 23px 25px;border-radius:25px;background:#031d43ed}
      .brand-mark{display:none}
      .login-card h1{font-size:31px;letter-spacing:-.8px}
      .subtitle{font-size:15px;margin:8px 0 22px}
      .field input{height:56px;padding-left:64px;font-size:17px;border-radius:14px}
      .field svg{left:19px;width:24px;height:24px}
      .submit{height:56px;margin-top:20px;font-size:22px;border-radius:14px}
      .login-options{font-size:12px}
      .forgot{font-size:12px}
      .features{margin-top:25px;padding-top:17px}
      .feature{padding:0 5px;min-height:62px}
      .feature svg{width:27px;height:27px}
      .feature strong{font-size:12px}
      .slogan{margin-top:21px;padding-top:16px;font-size:11px;letter-spacing:3px}
      .slogan::before{width:54px;height:4px;margin-bottom:12px}
    }
    @media(max-height:760px) and (min-width:701px){body.login-page{align-items:flex-start;padding-top:18px;padding-bottom:18px}.login-card{padding-top:24px;padding-bottom:22px}.features{margin-top:22px}.slogan{margin-top:19px}}
  </style>
</head>
<body class="login-page">
  <main class="login-card" aria-labelledby="login-title">
    <img class="brand-mark" src="logo-piremaxx-transparent.png" alt="Piremaxx Pneus Premium">
    <h1 id="login-title">Piremaxx <span>Gestor</span></h1>
    <p class="subtitle">Sistema Integrado de Gestão Empresarial</p>
    <form id="loginForm">
      <label class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-3.4 3.1-5.3 7-5.3s6.4 1.9 7 5.3"/></svg>
        <input id="email" type="email" value="" placeholder="Usuário" autocomplete="username" required>
      </label>
      <label class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
        <input id="password" type="password" value="" placeholder="Senha" autocomplete="current-password" required>
        <button class="toggle-password" id="togglePassword" type="button" aria-label="Mostrar senha">⌧</button>
      </label>
      <button class="submit" type="submit">Entrar　→</button>
      <div class="login-options">
        <label class="remember"><input id="remember" type="checkbox"> <span>Lembrar de mim</span></label>
        <button class="forgot" id="forgot" type="button">Esqueci minha senha?</button>
        <a href="usuarios.html" style="display:block;margin-top:16px;color:#afd2ff;text-align:center">Primeiro acesso: cadastrar usuário</a>
      </div>
      <div class="message" id="message" role="alert"></div>
    </form>
    <section class="features" aria-label="Benefícios">
      <div class="feature"><svg viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg><strong>Mais<br>Produtividade</strong></div>
      <div class="feature"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 2.3 2.9-.2.7 2.8 2.6 1.3-1.1 2.7 1.1 2.7-2.6 1.3-.7 2.8-2.9-.2L12 21l-1.8-2.3-2.9.2-.7-2.8L4 14.8l1.1-2.7L4 9.4l2.6-1.3.7-2.8 2.9.2L12 3z"/><circle cx="12" cy="12" r="2.5"/></svg><strong>Mais<br>Controle</strong></div>
      <div class="feature"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c.4-3.6 2.4-5.5 6-5.5s5.6 1.9 6 5.5M14 15.5c3.8-.4 6.1 1.2 6.8 4.5"/></svg><strong>Melhores<br>Resultados</strong></div>
    </section>
    <p class="slogan">MAIS QUILÔMETROS<br>PARA UM MUNDO MELHOR</p>
  </main>
  <script>
    const form=document.getElementById('loginForm');
    const message=document.getElementById('message');
    const email=document.getElementById('email');
    const password=document.getElementById('password');
    document.getElementById('togglePassword').addEventListener('click',()=>{const visible=password.type==='text';password.type=visible?'password':'text';document.getElementById('togglePassword').textContent=visible?'⌧':'◉';document.getElementById('togglePassword').setAttribute('aria-label',visible?'Mostrar senha':'Ocultar senha')});
    document.getElementById('forgot').addEventListener('click',()=>{message.textContent='Entre em contato com o administrador do sistema para redefinir sua senha.';message.classList.add('show')});
    form.addEventListener('submit',async event=>{event.preventDefault();message.classList.remove('show');const button=form.querySelector('.submit');button.disabled=true;button.textContent='Entrando...';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const result=await response.json();if(!response.ok)throw Error(result.error||'Credenciais inválidas');localStorage.setItem('piremaxx-session',JSON.stringify(result));location.href='index.html'}catch(error){message.textContent=error.message;message.classList.add('show');button.disabled=false;button.textContent='Entrar　→'}});
  </script>
</body>
</html>
