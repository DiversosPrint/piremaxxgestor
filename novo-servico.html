<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão Piremaxx - Novo serviço</title>
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#526e7b;font:12px Arial,sans-serif}.service-page{margin-left:143px;min-height:100vh;padding-top:42px}.service-top{position:fixed;z-index:40;left:143px;right:0;top:0;height:43px;background:#9b2d8b;color:#fff;padding:14px 12px;font-size:14px;font-weight:bold}.service-top .attachment{float:right;background:#fff;color:#54636a;padding:8px 12px;margin-top:-14px;height:43px;font-weight:normal}.service-top .close{float:right;margin:0 10px;color:#6d1e62;font-size:16px;cursor:pointer}.service-body{padding:40px 64px 70px}.service-tabs{display:flex;height:42px;border:2px solid #ddd;border-radius:4px;background:#eee;margin-bottom:16px}.service-tabs button{flex:1;border:0;background:transparent;color:#9b2d8b;font-weight:bold;cursor:pointer}.service-tabs button.active{margin:5px;background:#9b2d8b;color:#fff;border-radius:3px;box-shadow:0 0 0 1px #222}.service-panel{background:#eee;border:1px solid #e0e0e0;border-radius:4px;padding:28px 32px;margin-bottom:16px}.service-grid{display:grid;grid-template-columns:1.35fr 1fr 1.35fr;gap:16px 24px}.service-grid .name{grid-column:1 / -1}.service-field label{display:block;margin-bottom:5px;color:#55707c}.service-field input,.service-field textarea{width:100%;height:28px;border:1px solid #c9d0d3;border-radius:3px;background:#fff;padding:0 10px;color:#55707c}.service-field input:focus,.service-field textarea:focus{outline:1px solid #9b2d8b;border-color:#9b2d8b}.service-field label button{font-size:11px;border:1px solid #bbb;background:#fafafa;border-radius:3px;color:#526e7b}.service-money{display:flex}.service-money span{width:29px;height:28px;border:1px solid #c9d0d3;border-radius:3px 0 0 3px;text-align:center;line-height:26px}.service-money input{border-radius:0 3px 3px 0}.service-notes{margin:0 12px 18px}.service-notes textarea{height:44px;resize:vertical}.service-tax-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 24px}.service-tax-group{height:65px;padding:26px 32px;font-weight:bold}.service-tax-group a{font-weight:normal;color:#2878ba;text-decoration:none}.service-footer{position:fixed;z-index:50;bottom:0;left:143px;right:0;height:57px;background:#fff;border-top:1px solid #ddd;text-align:right;padding:12px 64px}.service-footer button{height:31px;border:0;border-radius:3px;padding:0 16px;margin-left:5px;cursor:pointer}.service-save{background:#35a858;color:#fff;font-weight:bold}.service-back{background:#e5e5e5;color:#666}@media(max-width:900px){.service-body{padding:40px 22px 70px}.service-grid,.service-tax-grid{grid-template-columns:1fr 1fr}.service-grid .name{grid-column:1 / -1}.service-page{margin-left:143px}}
</style>
</head>
<body><aside class="sidebar"></aside><main class="service-page">
<header class="service-top">Novo serviço <span class="close" id="closeService">×</span><span class="attachment">⌕ Nenhum arquivo anexado</span></header>
<section class="service-body">
<nav class="service-tabs"><button class="active" data-tab="data">DADOS DO SERVIÇO</button><button data-tab="tax">DADOS FISCAIS</button></nav>
<div id="serviceDataPanel"><div class="service-panel"><div class="service-grid"><div class="service-field name"><label for="serviceName">Nome</label><input id="serviceName" autofocus></div><div class="service-field"><label for="servicePrice">Preço de venda</label><div class="service-money"><span>$</span><input id="servicePrice" inputmode="decimal"></div></div><div class="service-field"><label for="serviceKeywords">Palavras-chave</label><input id="serviceKeywords"></div></div></div><div class="service-field service-notes"><label for="serviceNotes">Anotações internas</label><textarea id="serviceNotes"></textarea></div></div>
<div id="serviceTaxPanel" hidden><div class="service-panel"><div class="service-tax-grid"><div class="service-field"><label for="serviceListItem">Item lista serviço <button type="button" id="serviceListSearch">Buscar</button></label><input id="serviceListItem"></div><div class="service-field"><label for="serviceCnae">CNAE</label><input id="serviceCnae"></div><div class="service-field"><label for="serviceMunicipalTax">Código de tributação municipal</label><input id="serviceMunicipalTax"></div><div class="service-field"><label for="serviceNationalTax">Código de tributação nacional</label><input id="serviceNationalTax"></div><div class="service-field"><label for="serviceNbs">Código NBS</label><input id="serviceNbs"></div></div></div><div class="service-panel service-tax-group">Grupo tributário vinculado <a href="#" id="changeTaxGroup">Alterar</a></div></div>
</section><footer class="service-footer"><button type="button" class="service-save" id="saveService">Salvar</button><button type="button" class="service-back" id="backServices">Voltar</button></footer></main>
<script src="menu-lateral.js?v=service-form-1"></script><script>
(function(){var tabs=document.querySelectorAll('.service-tabs button');tabs.forEach(function(tab){tab.addEventListener('click',function(){tabs.forEach(function(x){x.classList.remove('active')});tab.classList.add('active');var fiscal=tab.dataset.tab==='tax';document.getElementById('serviceDataPanel').hidden=fiscal;document.getElementById('serviceTaxPanel').hidden=!fiscal})});function back(){location.href='produtos.html'}document.getElementById('backServices').onclick=back;document.getElementById('closeService').onclick=back;document.getElementById('changeTaxGroup').onclick=function(e){e.preventDefault();alert('Grupo tributário vinculado: nenhum grupo selecionado.')};document.getElementById('serviceListSearch').onclick=function(){document.getElementById('serviceListItem').focus()};document.getElementById('saveService').onclick=function(){var name=document.getElementById('serviceName').value.trim();if(!name){alert('Informe o nome do serviço.');document.getElementById('serviceName').focus();return}var saved=[];try{saved=JSON.parse(localStorage.getItem('localProducts')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){}saved.unshift({code:String(Date.now()).slice(-6),name:name,type:'Serviço',price:Number((document.getElementById('servicePrice').value||'').replace(',','.'))||0,keywords:document.getElementById('serviceKeywords').value,notes:document.getElementById('serviceNotes').value,serviceListItem:document.getElementById('serviceListItem').value,cnae:document.getElementById('serviceCnae').value,municipalTax:document.getElementById('serviceMunicipalTax').value,nationalTax:document.getElementById('serviceNationalTax').value,nbs:document.getElementById('serviceNbs').value});localStorage.setItem('localProducts',JSON.stringify(saved));back()}})();
</script></body></html>
