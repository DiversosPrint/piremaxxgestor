<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 80" width="1600" height="80" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradiente Azul Marinho Piremaxx -->
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d315e"/>
      <stop offset="35%" stop-color="#14437c"/>
      <stop offset="70%" stop-color="#0c2d58"/>
      <stop offset="100%" stop-color="#123d73"/>
    </linearGradient>

    <radialGradient id="glowCenter" cx="55%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#3578c4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0b284d" stop-opacity="0"/>
    </radialGradient>

    <!-- Padrão de Ícones Automotivos (Engrenagens, Rodas, Pistões, Chaves, Amortecedores, Freios) -->
    <pattern id="autoPattern" x="0" y="0" width="220" height="80" patternUnits="userSpaceOnUse">
      <g stroke="#7bc0ff" stroke-width="1.5" fill="none" opacity="0.24" stroke-linecap="round" stroke-linejoin="round">
        <!-- Roda / Aro Esportivo -->
        <g transform="translate(26, 24)">
          <circle cx="0" cy="0" r="15" stroke-width="2.2"/>
          <circle cx="0" cy="0" r="11" stroke-dasharray="3 2"/>
          <circle cx="0" cy="0" r="4"/>
          <line x1="0" y1="-11" x2="0" y2="-4"/>
          <line x1="0" y1="4" x2="0" y2="11"/>
          <line x1="-11" y1="0" x2="-4" y2="0"/>
          <line x1="4" y1="0" x2="11" y2="0"/>
          <line x1="-8" y1="-8" x2="-3" y2="-3"/>
          <line x1="8" y1="8" x2="3" y2="3"/>
          <line x1="8" y1="-8" x2="3" y2="-3"/>
          <line x1="-8" y1="8" x2="-3" y2="3"/>
        </g>

        <!-- Pistão e Biela -->
        <g transform="translate(70, 12) rotate(18)">
          <rect x="-8" y="0" width="16" height="18" rx="2"/>
          <line x1="-8" y1="4" x2="8" y2="4"/>
          <line x1="-8" y1="7" x2="8" y2="7"/>
          <circle cx="0" cy="11" r="2.5"/>
          <path d="M-2.5 13.5 L-4 28 L4 28 L2.5 13.5"/>
          <circle cx="0" cy="31" r="4.5"/>
        </g>

        <!-- Chave Combinada / Mecânica -->
        <g transform="translate(110, 22) rotate(-32)">
          <path d="M-3 -14 L-3 14 M3 -14 L3 14"/>
          <path d="M-6 -14 A6 6 0 1 1 6 -14 L3 -10 L-3 -10 Z"/>
          <circle cx="0" cy="18" r="5.5"/>
          <circle cx="0" cy="18" r="2.5"/>
        </g>

        <!-- Engrenagem Dupla -->
        <g transform="translate(152, 26)">
          <circle cx="0" cy="0" r="10"/>
          <circle cx="0" cy="0" r="4.5"/>
          <path d="M-2 -13 H2 L3 -10 H-3 Z M-2 13 H2 L3 10 H-3 Z M-13 -2 V2 L-10 3 V-3 Z M13 -2 V2 L10 3 V-3 Z"/>
          <path d="M-10 -8 L-8 -10 L-6 -7 L-8 -5 Z M10 -8 L8 -10 L6 -7 L8 -5 Z M-10 8 L-8 10 L-6 7 L-8 5 Z M10 8 L8 10 L6 7 L8 5 Z"/>
        </g>

        <!-- Amortecedor / Mola Helicoidal -->
        <g transform="translate(192, 14) rotate(12)">
          <rect x="-3" y="0" width="6" height="7" rx="1"/>
          <line x1="0" y1="7" x2="0" y2="34"/>
          <path d="M-6 10 L6 13 L-6 16 L6 19 L-6 22 L6 25 L-6 28"/>
          <rect x="-4" y="28" width="8" height="8" rx="1"/>
          <circle cx="0" cy="39" r="2.5"/>
        </g>

        <!-- Silhueta de Carro na linha inferior -->
        <g transform="translate(46, 62)">
          <path d="M-18 6 L-14 -2 L-6 -7 L8 -7 L15 -2 L19 6 Z"/>
          <circle cx="-10" cy="7" r="4"/>
          <circle cx="10" cy="7" r="4"/>
        </g>

        <!-- Disco de Freio Ventilado -->
        <g transform="translate(132, 60)">
          <circle cx="0" cy="0" r="13"/>
          <circle cx="0" cy="0" r="5"/>
          <path d="M8 -10 A14 14 0 0 1 14 2 L10 4 A10 10 0 0 0 5 -7 Z" fill="#7bc0ff" fill-opacity="0.22"/>
          <circle cx="-7" cy="-5" r="0.9"/>
          <circle cx="-5" cy="7" r="0.9"/>
          <circle cx="6" cy="7" r="0.9"/>
        </g>

        <!-- Porcas sextavadas -->
        <polygon points="88,55 92,53 96,55 96,60 92,62 88,60"/>
        <circle cx="92" cy="57.5" r="1.8"/>
      </g>
    </pattern>

    <!-- Bloco de Rastro de Pneu (Tread Track) -->
    <pattern id="tireTread" x="0" y="0" width="58" height="22" patternUnits="userSpaceOnUse">
      <g fill="#82c6ff">
        <!-- Gomos laterais esquerdos -->
        <polygon points="2,2 15,5 14,11 1,8"/>
        <polygon points="2,12 14,15 13,20 1,17"/>
        <!-- Blocos centrais em V (chevron) -->
        <polygon points="18,3 28,7 28,13 18,9"/>
        <polygon points="18,13 28,17 28,21 18,17"/>
        <polygon points="40,3 30,7 30,13 40,9"/>
        <polygon points="40,13 30,17 30,21 40,17"/>
        <!-- Gomos laterais direitos -->
        <polygon points="56,2 43,5 44,11 57,8"/>
        <polygon points="56,12 44,15 45,20 57,17"/>
      </g>
    </pattern>
  </defs>

  <!-- Fundo Base Azul Marinho -->
  <rect width="1600" height="80" fill="url(#navyBg)"/>
  <rect width="1600" height="80" fill="url(#glowCenter)"/>

  <!-- Camada de Ícones Automotivos -->
  <rect width="1600" height="80" fill="url(#autoPattern)"/>

  <!-- Rastro de Pneu Sutil à Esquerda/Centro -->
  <g transform="translate(420, -25) rotate(22)" opacity="0.22">
    <rect x="0" y="0" width="58" height="160" fill="url(#tireTread)"/>
    <line x1="-3" y1="0" x2="-3" y2="160" stroke="#82c6ff" stroke-width="1.8" stroke-dasharray="6 4"/>
    <line x1="61" y1="0" x2="61" y2="160" stroke="#82c6ff" stroke-width="1.8" stroke-dasharray="6 4"/>
  </g>

  <!-- Rastro de Pneu Principal (Centro-Direita, como na referência) + Engrenagens Mecânicas -->
  <g transform="translate(1140, -28) rotate(20)" opacity="0.42">
    <!-- Trilha principal de pneu -->
    <rect x="0" y="0" width="58" height="170" fill="url(#tireTread)"/>
    <line x1="-4" y1="0" x2="-4" y2="170" stroke="#9ad2ff" stroke-width="2.2" opacity="0.8"/>
    <line x1="62" y1="0" x2="62" y2="170" stroke="#9ad2ff" stroke-width="2.2" opacity="0.8"/>

    <!-- Engrenagem acoplada ao rastro (estilo referência) -->
    <g transform="translate(-14, 38)" stroke="#9ad2ff" stroke-width="2.2" fill="#0e3463" fill-opacity="0.85">
      <circle cx="0" cy="0" r="16"/>
      <circle cx="0" cy="0" r="9" stroke-dasharray="4 2"/>
      <circle cx="0" cy="0" r="4" fill="#9ad2ff"/>
      <g fill="#9ad2ff" stroke="none">
        <rect x="-2.5" y="-20" width="5" height="5" rx="1"/>
        <rect x="-2.5" y="15" width="5" height="5" rx="1"/>
        <rect x="-20" y="-2.5" width="5" height="5" rx="1"/>
        <rect x="15" y="-2.5" width="5" height="5" rx="1"/>
        <rect x="-2.5" y="-20" width="5" height="5" rx="1" transform="rotate(45)"/>
        <rect x="-2.5" y="15" width="5" height="5" rx="1" transform="rotate(45)"/>
        <rect x="-20" y="-2.5" width="5" height="5" rx="1" transform="rotate(45)"/>
        <rect x="15" y="-2.5" width="5" height="5" rx="1" transform="rotate(45)"/>
      </g>
    </g>

    <!-- Segunda engrenagem menor -->
    <g transform="translate(-22, 68)" stroke="#9ad2ff" stroke-width="1.8" fill="#0e3463" fill-opacity="0.85">
      <circle cx="0" cy="0" r="10"/>
      <circle cx="0" cy="0" r="4"/>
    </g>
  </g>

  <!-- Rastro de Pneu Secundário próximo ao canto direito -->
  <g transform="translate(1470, -25) rotate(20)" opacity="0.2">
    <rect x="0" y="0" width="58" height="160" fill="url(#tireTread)"/>
  </g>

  <!-- Linha de acabamento inferior sutil -->
  <line x1="0" y1="79.5" x2="1600" y2="79.5" stroke="#1e5294" stroke-width="1" opacity="0.7"/>
</svg>