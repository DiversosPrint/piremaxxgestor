<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações</title><link rel="stylesheet" href="styles.css"><style>.config{margin:30px 15px;background:#fff;border:1px solid #d9dee2}.tabs{display:flex;flex-wrap:wrap;background:#eef0f2;border-bottom:1px solid #14ae9f}.tabs button{border:0;background:#587986;color:#fff;padding:13px 15px;font-weight:700;cursor:pointer}.tabs button.active{background:#13ab9c}.panel{padding:30px;background:#eee}.panel h2{color:#517082;font-size:16px;font-weight:400}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.field{display:flex;flex-direction:column;gap:5px;color:#557086;font-size:12px}.field input,.field select{padding:10px;border:1px solid #c9d0d5;border-radius:3px;background:#fff}.wide{grid-column:1/-1}.save{float:right;background:#09b991;color:white;border:0;padding:11px 35px;border-radius:3px;font-weight:bold}.clear{clear:both}@media(max-width:800px){.fields{grid-template-columns:1fr}}
</style></head><body><header class="app-head"><div class="search"><input placeholder="Digite sua busca"><button>⌕</button></div><div class="identity"><strong>ODIMAN COSTA</strong>DNFX - COMERCIO DE PNEUS <span class="avatar">◕</span>⌄</div></header><header class="page-head"><h1>Configurações</h1><div class="page-head-actions"><button class="top-btn tutorial">▦ Tutoriais</button><button class="top-btn top-new">⊞ Novo⌄</button></div></header><main class="config"><div class="tabs"><button class="active" data-panel="geral">⚙ GERAL</button><button data-panel="contas">▤ PLANO DE CONTAS</button><button data-panel="caixa">▥ CONTAS CAIXA</button><button data-panel="operacoes">⚑ OPERAÇÕES</button><button data-panel="pagto">▣ FORMAS PGTO</button><button data-panel="boletos">▥ BOLETOS</button><button data-panel="fiscal">▧ FISCAL</button><button data-panel="usuarios">♟ USUÁRIOS</button><button data-panel="api">☁ API</button></div><section class="panel" id="panel"><h2>⚙ Configuração geral</h2><div class="fields"><label class="field">CNPJ / CPF<input id="doc" value="39290148000143"></label><label class="field">Razão Social / Nome<input id="company" value="DORACI NOGUEIRA FILHO LTDA"></label><label class="field">Nome Fantasia<input id="trade" value="DNFX - COMERCIO DE PNEUS"></label><label class="field">Inscrição Estadual<input id="ie" value="11846840"></label><label class="field">CNAE principal<input id="cnae" value="4530702"></label><label class="field">CEP<input id="zip" value="21011130"></label><label class="field wide">Endereço<input id="address" value="RUA URIQUE"></label><label class="field">Número<input id="number" value="00261"></label><label class="field">Complemento<input id="extra" value="GALPÃO"></label><label class="field">Bairro<input id="neighborhood" value="PENHA CIRCULAR"></label><label class="field">Cidade<input id="city" value="Rio de Janeiro"></label><label class="field">Estado<select id="state"><option>RJ</option><option>SP</option></select></label></div><br><button class="save" onclick="saveConfig()">Salvar</button><div class="clear"></div></section></main><script>const panel=document.querySelector('#panel');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.panel==='geral')location.reload();else panel.innerHTML='<h2>'+b.textContent.replace(/[▤▥⚑▣▧♟☁]/g,'').trim()+'</h2><p>Configuração disponível para preenchimento e integração com os dados do eGestor.</p><button class="save" onclick="alert(\'Configuração salva\')">Salvar</button>'});async function saveConfig(){const data={company:company.value,tradeName:trade.value,doc:doc.value,ie:ie.value,cnae:cnae.value,address:address.value,city:city.value,state:state.value};const b=await fetch('/api/backup').then(r=>r.json());b.settings={...b.settings,...data};await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});alert('Configurações salvas')}</script></body></html>
