<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Financeiro | Piremaxx Gestor</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root{--nav:#354a54;--head:#6b8d9c;--panel:#567381;--page:#eef0f4;--line:#d9dfe2;--green:#35ba6f;--red:#f15b62;--blue:#6398bd;--purple:#9a55aa}.tabs .tab,.tabs .tab.active{color:#fff!important}
    *{box-sizing:border-box}body{display:block;margin:0;background:var(--page);color:#777;font:14px/20px "Open Sans",Arial,sans-serif}a{color:#277cad;text-decoration:none;cursor:pointer}
    .app-head{height:65px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #d7dce0}.app-head .search{display:flex;width:360px;height:44px;margin:0}.app-head .search input{flex:1;width:auto;height:44px;border:1px solid #d7d7d7;padding:0 13px;color:#78909c;font-size:13px}.app-head .search button{width:90px;height:44px;border:0;background:#08bdb5;color:#fff;font-size:20px;font-weight:bold}.identity{text-align:right;line-height:1.45;color:#71828d;font-size:13px}.identity strong{display:block;color:#334d5b;font-size:14px}.avatar{display:inline-flex;vertical-align:middle;margin-left:12px;width:42px;height:42px;border-radius:50%;background:linear-gradient(#fff,#cfcfcf);border:1px solid #ddd;align-items:center;justify-content:center;color:#555;font-size:20px}
    .main{margin:0;padding:0;max-width:none;flex:none;min-width:0}.page-head{height:65px;background:var(--head);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 15px}.page-head h1{font-size:21px;font-weight:400;margin:0}.page-head button{border:0;border-radius:2px;color:#fff;font-weight:bold;padding:11px 16px;margin-left:6px;cursor:pointer}.tutorial{background:#f3b33d}.new{background:#09d888}
    .finance-area{margin:30px 15px;background:#fff;border:1px solid #d5dfe2}.tabs{border-bottom:1px solid #e8e8e8;display:flex;padding:0}.tab{flex:1;min-height:44px;border:0;border-right:3px solid #fff;background:#567381;color:#fff;text-align:left;padding:10px 18px;font-weight:bold;cursor:pointer}.tab:last-child{border-right:0}.tab.active.receipts{background:var(--green)}.tab.active.payments{background:var(--red)}.tab.active.recurring{background:#63a0f3}.tab.active.receipts-mode{background:var(--purple)}.tab.active.reconcile{background:var(--blue)}
    .toolbar{min-height:84px;border-bottom:1px solid #ddd;padding:20px 16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.tool{height:36px;min-width:38px;border:1px solid #ccd4dc;background:#fff;border-radius:4px;color:#687783;padding:7px 12px;cursor:pointer}.tool:hover{background:#f0f4f6}.toolbar .primary{color:#fff;border-color:transparent;font-weight:bold}.toolbar .primary.green{background:var(--green)}.toolbar .primary.red{background:var(--red)}.toolbar .primary.blue{background:var(--blue)}.toolbar .primary.purple{background:var(--purple)}.filter{margin-left:auto;background:#327fb7;color:#fff;border-radius:4px;padding:8px 12px;min-width:180px;font-size:12px}.filter strong{display:block;color:#fff}.filter a{color:#ffe800;font-weight:bold}.month{margin-left:auto;display:flex;gap:5px;align-items:center}.month button{height:36px}.month-label{min-width:130px;text-align:center;border-bottom:2px solid #35ba6f;padding:8px 15px;color:#777}
    .list-wrap{overflow:auto}.list{display:table;width:100%;border-collapse:collapse;table-layout:auto}.list th,.list td{text-align:left;padding:13px 14px;border-bottom:1px solid #eee;white-space:nowrap}.list th{font-weight:700;color:#526d7b;background:#fff}.list tr:nth-child(even){background:#f2f2f2}.list td.value,.list th.value{text-align:right}.list .check{width:44px;text-align:center}.list .empty{white-space:normal;text-align:center;padding:30px;color:#777}.list .empty small{display:block;margin-top:5px}.list-total{display:flex;justify-content:space-between;padding:13px 16px;background:#fff;border-top:1px solid #eee;font-weight:bold}.pager{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ddd;padding:16px}.pager select{height:34px;border:1px solid #ccd4dc;padding:5px}.pager-buttons button{height:34px;min-width:34px;border:1px solid #d9dfe2;background:#fff;color:#687783}.pager-buttons button.active{background:#e8edf0}
    .editor{display:none;padding:0 20px 28px;background:#fff}.editor.show{display:block}.list-view.hidden{display:none}.editor-title{margin:0 -20px 22px;padding:14px 20px;background:#eee;color:#5f7582;font-size:17px;font-weight:400;border-bottom:1px solid #ddd}.form-section{background:#eee;border:1px solid #ddd;padding:20px;margin-bottom:18px}.form-section h2{margin:0 0 18px;color:#5d7482;font-size:16px;font-weight:400}.form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.field{grid-column:span 4}.field.wide{grid-column:span 8}.field.full{grid-column:1/-1}.field label{display:block;color:#5f7480;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;height:36px;padding:8px 10px;background:#fff;border:1px solid #c9d0d4;border-radius:2px;color:#5e7380}.field textarea{height:72px;resize:vertical}.editor-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}.btn-save{background:#35a762;color:#fff;border:0;border-radius:2px;padding:11px 18px;font-weight:bold}.btn-back{background:#eee;color:#777;border:1px solid #ccd4dc;border-radius:2px;padding:10px 18px}
    .special-view .recorrencia,.special-view .recibos,.special-view .conciliacao{padding:28px;text-align:center;color:#777;background:#f8f8f8}.special-view .recorrencia .icon,.special-view .recibos .icon,.special-view .conciliacao .icon{font-size:32px;color:#6398bd;display:block;margin-bottom:10px}.advanced{display:none;padding:16px;background:#f2f2f2;border-bottom:1px solid #ddd}.advanced.show{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.advanced label{font-size:12px;color:#5f7480}.advanced input,.advanced select{display:block;width:100%;height:34px;margin-top:5px;border:1px solid #ccd4dc;padding:7px;background:#fff}
    @media(max-width:1100px){.tabs{display:block}.tab{display:block;width:100%;border-right:0;border-bottom:3px solid #fff;text-align:left}.tab:last-child{border-bottom:0}.finance-area{margin-top:20px}.month{margin-left:0}.filter{margin-left:auto}}@media(max-width:700px){.main{margin-left:0}.app-head .search{width:calc(100% - 80px)}.app-head .search input{min-width:0}.identity{display:none}.finance-area{margin:15px 8px}.form-grid{grid-template-columns:1fr}.field,.field.wide,.field.full{grid-column:1}.toolbar{padding:14px}.filter{margin-left:0;width:100%}}
  </style>
</head>
<body>
  <header class="app-head"><div class="search"><input id="globalSearch" placeholder="em:recebimentos"><button>⌕</button></div><div class="identity"><strong>ODIMAN COSTA</strong>DNFX - COMERCIO DE PNEUS <span class="avatar">◕</span>⌄</div></header>
  <main class="main"><header class="page-head"><h1>Financeiro</h1><div><button class="tutorial">▦ Tutoriais</button><button class="new" id="topNew">⊞ Novo⌄</button></div></header>
    <section class="finance-area">
      <nav class="tabs" aria-label="Abas financeiras"><button class="tab receipts active" data-mode="recebimentos">↪ RECEBIMENTOS</button><button class="tab payments" data-mode="pagamentos">↪ PAGAMENTOS</button><button class="tab recurring" data-mode="recorrencia">↻ RECORRÊNCIA</button><button class="tab receipts-mode" data-mode="recibos">▣ RECIBOS</button><button class="tab reconcile" data-mode="conciliacao">▥ CONCILIAÇÃO</button></nav>
      <section id="listView" class="list-view"><div class="toolbar"><button id="newEntry" class="tool primary green">⊞ Novo</button><button id="deleteSelected" class="tool">♜</button><button id="editMenu" class="tool">✎⌄</button><button id="moneyMenu" class="tool">$⌄</button><button id="receiptAction" class="tool">▣</button><button id="printList" class="tool">▤</button><div class="filter"><strong>Filtro avançado ativo</strong><a id="removeFilter">Remover filtro</a></div><div class="month"><button class="tool" id="currentMonth">Mês Atual</button><button class="tool" id="previousMonth">‹</button><span class="month-label">Setembro 2026</span><button class="tool" id="nextMonth">›</button></div></div><div id="advanced" class="advanced"><label>Descrição<input id="filterDescription"></label><label>Contato<input id="filterContact"></label><label>Situação<select id="filterStatus"><option value="">Todas</option><option>Em aberto</option><option>Pago</option><option>Agendado</option></select></label><label>Valor mínimo<input id="filterMinimum" type="number" step="0.01"></label></div><div class="list-wrap"><table class="list"><thead id="listHead"></thead><tbody id="rows"></tbody></table></div><div class="list-total"><span id="totalLabel">TOTAL LISTADO (0 itens)</span><span id="totalValue">R$ 0,00</span></div><div class="pager"><select><option>100 linhas por página</option><option>50 linhas por página</option><option>25 linhas por página</option></select><div class="pager-buttons"><button>⏮</button><button>◀</button><button class="active">1/1</button><button>▶</button><button>⏭</button></div></div></section>
      <section id="specialView" class="special-view" style="display:none"></section>
      <section id="editor" class="editor"><h2 class="editor-title" id="editorTitle">Novo recebimento</h2><div class="form-section"><h2>Dados do lançamento</h2><div class="form-grid"><div class="field wide"><label>Descrição<input id="entryDescription"></label></div><div class="field"><label>Tipo<select id="entryType"><option value="Recebimento">Recebimento</option><option value="Pagamento">Pagamento</option></select></label></div><div class="field"><label>Contato<input id="entryContact"></label></div><div class="field"><label>Data de vencimento<input id="entryDate" type="date"></label></div><div class="field"><label>Valor<input id="entryValue" type="number" step="0.01" min="0"></label></div><div class="field"><label>Conta<input id="entryAccount" placeholder="Conta caixa"></label></div><div class="field"><label>Situação<select id="entryStatus"><option>Em aberto</option><option>Pago</option><option>Agendado</option></select></label></div><div class="field full"><label>Observações<textarea id="entryNotes"></textarea></label></div></div></div><div class="editor-actions"><button class="btn-back" id="cancelEditor">Voltar</button><button class="btn-save" id="saveEntry">Salvar</button></div></section>
    </section>
  </main>
  <script>
    let items=[],mode='recebimentos',editorMode='Recebimento';const $=id=>document.getElementById(id),num=v=>{const s=String(v??'0');return Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s)||0},money=v=>num(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),descOf=x=>x.description||x.descricao||x.desc||'',contactOf=x=>x.contact||x.contato||x.fornecedor||x.codcontato||'',dateOf=x=>x.due||x.vencimento||x.date||x.dtvenc||x.dtcad||'',valueOf=x=>num(x.value??x.valor??x.total??0),typeOf=x=>String(x.type||x.tipo||'').toLowerCase();
    function isPayment(x){return /pag|sa[ií]da|despesa|compra/.test(typeOf(x)+' '+descOf(x).toLowerCase())}
    function listForMode(){let list=mode==='recebimentos'?items.filter(x=>!isPayment(x)):mode==='pagamentos'?items.filter(isPayment):mode==='recorrencia'?items.filter(x=>x.recurrence||x.recorrencia):[];const description=($('filterDescription')?.value||'').trim().toLowerCase(),contact=($('filterContact')?.value||'').trim().toLowerCase(),status=$('filterStatus')?.value||'',minimum=num($('filterMinimum')?.value);return list.filter(x=>(!description||descOf(x).toLowerCase().includes(description))&&(!contact||contactOf(x).toLowerCase().includes(contact))&&(!status||String(x.status||x.situacao||'')===status)&&(!minimum||valueOf(x)>=minimum))}
    function headers(){if(mode==='conciliacao')return ['Cód','Arquivo','Banco','Identificação','Conta','Data arquivo','Concluído'];if(mode==='recorrencia')return ['Cód','Contato','A cada','Criar','Início','Último','Próximo','Situação','Valor'];if(mode==='recibos')return ['Cód','Contato','Referência','Data','Valor'];return ['','Cód','Descrição','Contato','Conta','Data','Situação','Valor']}
    function render(){const h=headers();$('listHead').innerHTML='<tr>'+h.map((x,i)=>'<th class="'+(i===0?'check ':'')+(i===h.length-1?'value':'')+'">'+(i===0?'□':x)+'</th>').join('')+'</tr>';const list=listForMode();const rows=$('rows');if(!list.length){rows.innerHTML='<tr><td colspan="'+h.length+'" class="empty">Nenhum '+(mode==='pagamentos'?'pagamento':mode==='recebimentos'?'recebimento':mode==='recibos'?'recibo':'registro')+' encontrado.<br><small>Veja no mês anterior</small></td></tr>'}else{rows.innerHTML=list.slice(0,100).map(x=>'<tr><td class="check"><input type="checkbox" data-id="'+esc(x.id)+'"></td><td>'+esc(x.id)+'</td><td>'+esc(descOf(x))+'</td><td>'+esc(contactOf(x))+'</td><td>'+esc(x.account||x.conta||x.codplanocontas||'')+'</td><td>'+esc(dateOf(x))+'</td><td>'+esc(x.status||x.situacao||'')+'</td><td class="value">'+money(valueOf(x))+'</td></tr>').join('')}const total=list.reduce((a,x)=>a+valueOf(x),0);$('totalLabel').textContent='TOTAL LISTADO ('+list.length+' itens)';$('totalValue').textContent=money(total);$('globalSearch').placeholder='em:'+mode;}
    function selectMode(next){mode=next;document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',t.dataset.mode===mode)});const listMode=['recebimentos','pagamentos'].includes(mode);$('listView').style.display=listMode?'block':'none';$('specialView').style.display=listMode?'none':'block';if(!listMode){const labels={recorrencia:['↻','Nenhuma recorrência encontrada.','Nova recorrência'],recibos:['▣','Nenhum recibo encontrado.','Novo recibo'],conciliacao:['▥','Nenhuma conciliação encontrada.','Nova conciliação']}[mode];$('specialView').innerHTML='<div class="'+mode+'"><span class="icon">'+labels[0]+'</span>'+labels[1]+'<br><button class="tool" id="specialNew">⊞ '+labels[2]+'</button></div>';document.querySelector('#specialNew').onclick=()=>openEditor(mode==='recorrencia'?'Recorrência':mode==='recibos'?'Recibo':'Conciliação')}render()}
    function openEditor(kind){editorMode=kind;$('listView').style.display='none';$('specialView').style.display='none';$('editor').classList.add('show');$('editorTitle').textContent='Novo '+kind.toLowerCase();$('entryType').value=kind==='Pagamento'?'Pagamento':'Recebimento';}
    function closeEditor(){ $('editor').classList.remove('show');selectMode(mode) }
    async function saveEntry(){const x={description:$('entryDescription').value.trim(),type:$('entryType').value,contact:$('entryContact').value.trim(),date:$('entryDate').value,value:num($('entryValue').value),account:$('entryAccount').value.trim(),status:$('entryStatus').value,notes:$('entryNotes').value.trim()};if(!x.description){alert('Informe a descrição');return}const r=await fetch('/api/finance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});if(!r.ok){alert('Não foi possível salvar o lançamento');return}items.unshift(await r.json());$('editor').classList.remove('show');selectMode(x.type==='Pagamento'?'pagamentos':'recebimentos')}
    document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>selectMode(t.dataset.mode));$('newEntry').onclick=()=>openEditor(mode==='pagamentos'?'Pagamento':'Recebimento');$('topNew').onclick=()=>openEditor(mode==='pagamentos'?'Pagamento':'Recebimento');$('cancelEditor').onclick=closeEditor;$('saveEntry').onclick=saveEntry;$('printList').onclick=()=>window.printFinanceReport(mode);$('advanced').onclick=e=>e.stopPropagation();$('removeFilter').onclick=()=>{$('advanced').classList.remove('show');document.querySelector('.filter').style.display='none'};document.querySelector('.filter').onclick=()=>$('advanced').classList.toggle('show');$('deleteSelected').onclick=async()=>{const ids=[...document.querySelectorAll('input[data-id]:checked')].map(x=>x.dataset.id);if(!ids.length)return;for(const id of ids)await fetch('/api/finance/'+encodeURIComponent(id),{method:'DELETE'});items=items.filter(x=>!ids.includes(String(x.id)));render()};$('filterDescription').oninput=render;$('filterContact').oninput=render;$('filterStatus').onchange=render;$('filterMinimum').oninput=render;async function load(){try{const r=await fetch('/api/finance');items=await r.json();render()}catch(e){$('rows').innerHTML='<tr><td colspan="8" class="empty">Não foi possível carregar o Financeiro.</td></tr>'}}load();
  </script>
</body>
</html>
