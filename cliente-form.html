<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de cliente | Piremaxx Gestor</title><link rel="stylesheet" href="styles.css"><style>.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:24px}.tab{border:0;background:none;color:var(--muted);padding:11px 15px;border-radius:7px;cursor:pointer;font-weight:700}.tab.active{background:#edf3ff;color:var(--blue)}.panel{display:none}.panel.active{display:block}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field{display:block;width:100%;margin-top:7px;padding:11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font:inherit}label{color:var(--muted);font-size:12px;font-weight:600}hr{border:0;border-top:1px solid var(--line);margin:24px 0}@media(max-width:600px){.form-grid{grid-template-columns:1fr}.tabs{overflow:auto;white-space:nowrap}}</style></head><body><main style="max-width:1100px"><header><div><p class="eyebrow">Piremaxx Gestor</p><h1>Cadastro de cliente</h1></div><button class="primary" onclick="history.back()">Voltar</button></header><div class="card"><div class="tabs"><button class="tab active" data-tab="dados">Dados</button><button class="tab" data-tab="endereco">Endereço</button><button class="tab" data-tab="adicionais">Informações adicionais</button></div><section class="panel active" id="dados"><h2>Tipo de contato</h2><label><input type="checkbox" checked> Cliente</label> <label><input type="checkbox"> Fornecedor</label> <label><input type="checkbox"> Transportador</label><hr><h2>Dados gerais</h2><div class="form-grid"><label>Nome / Razão Social<input class="field"></label><label>CPF / CNPJ<input class="field"></label><label>Nome fantasia<input class="field"></label><label>Nome do contato<input class="field"></label><label>Telefone(s)<input class="field"></label><label>E-mail(s)<input class="field"></label></div></section><section class="panel" id="endereco"><h2>Endereço principal</h2><div class="form-grid"><label>CEP<input class="field"></label><label>Estado<input class="field"></label><label>Cidade<input class="field"></label><label>Endereço<input class="field"></label><label>Número<input class="field"></label><label>Complemento<input class="field"></label><label>Bairro<input class="field"></label></div><button class="ghost">+ Adicionar endereço de entrega</button></section><section class="panel" id="adicionais"><h2>Informações fiscais e adicionais</h2><div class="form-grid"><label>Indicador de IE<select class="field"><option>Contribuinte</option><option>Isento de IE</option><option>Não contribuinte</option></select></label><label>Inscrição Estadual<input class="field"></label><label>IE Subst. Trib.<input class="field"></label><label>Inscrição Municipal<input class="field"></label><label>Suframa<input class="field"></label><label>RNTRC<input class="field"></label><label>Data nascimento<input class="field" type="date"></label><label>Palavras-chave<input class="field"></label><label>Data comemorativa<input class="field" type="date"></label><label>Descrição da comemoração<input class="field"></label><label>Bases legais (LGPD)<select class="field"><option>Utilizar configuração padrão</option><option>Consentimento</option><option>Execução contratual</option><option>Legítimo interesse</option></select></label></div><label style="display:block;margin-top:18px">Observações<textarea class="field" rows="4"></textarea></label></section><div style="text-align:right;margin-top:24px"><button class="primary" onclick="alert('Cadastro preparado')">Salvar cliente</button></div></div></main><script>document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')})</script></body></html>
