<script>
document.addEventListener('DOMContentLoaded',function(){setTimeout(function(){
  const fields=[...document.querySelectorAll('#dados .field')];
  const cpf=fields.find(x=>x.textContent.includes('CPF / CNPJ'))?.querySelector('input');
  if(!cpf||document.querySelector('.cnpj-real'))return;
  const holder=cpf.parentElement;
  const button=document.createElement('button');
  button.type='button';button.className='cnpj-real';button.textContent='Autopreencher';
  button.style='margin-top:4px;background:#eee;border:1px solid #cbd1d4;color:#54718a;padding:5px 9px;cursor:pointer;align-self:flex-start';
  holder.appendChild(button);
  function value(label){return fields.find(x=>x.textContent.includes(label))?.querySelector('input,select,textarea')}
  button.onclick=async function(){
    const digits=cpf.value.replace(/\D/g,'');
    if(digits.length!==14){alert('Informe um CNPJ válido com 14 dígitos.');return}
    button.disabled=true;button.textContent='Consultando...';
    try{
      const response=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+digits);
      if(!response.ok)throw new Error('CNPJ não encontrado');
      const data=await response.json();
      const nome=value('Nome / Razão Social'),fantasia=value('Nome fantasia'),telefone=value('Telefone(s)'),email=value('E-mail(s)');
      if(nome)nome.value=data.razao_social||'';
      if(fantasia)fantasia.value=data.nome_fantasia||'';
      if(telefone)telefone.value=data.ddd_telefone_1||data.ddd_telefone_2||'';
      if(email)email.value=data.email||'';
      const end=[...document.querySelectorAll('#endereco .field')];
      const set=(label,val)=>{const el=end.find(x=>x.textContent.includes(label))?.querySelector('input,select');if(el&&val)el.value=val};
      set('CEP',data.cep);set('Endereço',data.logradouro);set('Número',data.numero);set('Complemento',data.complemento);set('Bairro',data.bairro);set('Estado',data.uf);set('Cidade',data.municipio);
      alert('Dados do CNPJ preenchidos com sucesso.');
    }catch(e){alert('Não foi possível consultar este CNPJ. Verifique os números e tente novamente.')}finally{button.disabled=false;button.textContent='Autopreencher'}
  };
},0)});
</script>
<script>
// Salvamento final e configuração automática pela aba de origem (Cliente, Comprador, Fornecedor, Transportador)
(function(){
  var params=new URLSearchParams(location.search);
  var editKey=params.get('edit');
  var rawTipo=(params.get('tipo')||'').toLowerCase();
  var allContacts=[];
  try{allContacts=JSON.parse(localStorage.getItem('piremaxx_contatos')||'[]')}catch(e){allContacts=[]}
  var existing=editKey&&allContacts.find(function(x){return String(x.nome).trim()===String(editKey).trim()||String(x.id)===String(editKey)});
  var tipo=['cliente','comprador','fornecedor','transportador','vendedor'].includes(rawTipo)?rawTipo:(existing&&Array.isArray(existing.tipos)&&existing.tipos[0]?existing.tipos[0]:'cliente');

  var meta={
    cliente:{titleNew:'Novo cliente',titleEdit:'Editar cliente',color:'#64a3f5',hash:'clientes',search:'em:clientes '},
    comprador:{titleNew:'Novo comprador',titleEdit:'Editar comprador',color:'#b17828',hash:'compradores',search:'em:compradores '},
    fornecedor:{titleNew:'Novo fornecedor',titleEdit:'Editar fornecedor',color:'#f36f21',hash:'fornecedores',search:'em:fornecedores '},
    transportador:{titleNew:'Novo transportador',titleEdit:'Editar transportador',color:'#4dcc00',hash:'transportadores',search:'em:transportadores '},
    vendedor:{titleNew:'Novo vendedor',titleEdit:'Editar vendedor',color:'#6f42c1',hash:'vendedores',search:'em:vendedores '}
  }[tipo]||{titleNew:'Novo cliente',titleEdit:'Editar cliente',color:'#64a3f5',hash:'clientes',search:'em:clientes '};

  function applyCategoryTheme(){
    var pageTitle=editKey?meta.titleEdit:meta.titleNew;
    document.title='Gestão Piremaxx - '+pageTitle;
    var head=document.querySelector('.client-form-head');
    if(head){
      head.textContent=pageTitle;
      head.style.setProperty('background',meta.color,'important');
    }
    var style=document.getElementById('auto-contact-type-style');
    if(!style){
      style=document.createElement('style');
      style.id='auto-contact-type-style';
      document.head.appendChild(style);
    }
    style.textContent=
      '.new-client .contact-types{display:none!important}'+
      '.new-client .form-panel{width:100%!important;margin-left:0!important;box-sizing:border-box!important}'+
      '.new-client .client-tabs button{color:'+meta.color+'!important}'+
      '.new-client .client-tabs button.active{background:'+meta.color+'!important;color:#fff!important}';
    var backBtn=document.querySelector('.actions .back');
    if(backBtn){
      backBtn.onclick=function(e){
        e.preventDefault();
        location.href='clientes.html#'+meta.hash;
      };
    }
    var box=document.querySelector('.contact-types');
    if(box){
      box.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
        cb.checked=(cb.value===tipo);
      });
    }
  }
  applyCategoryTheme();
  document.addEventListener('DOMContentLoaded',function(){
    applyCategoryTheme();
    var save=document.querySelector('.save');
    if(!save)return;
    save.addEventListener('click',function(event){
      event.preventDefault();
      event.stopImmediatePropagation();
      var readPanel=function(id){
        var o={};
        document.querySelectorAll('#'+id+' .field').forEach(function(f){
          var k=(f.querySelector('span')?.textContent.trim()||[].slice.call(f.childNodes).find(function(n){return n.nodeType===3})?.textContent.trim()||'').replace(/[:?]/g,'').trim();
          var c=f.querySelector('input:not([type=checkbox]),select,textarea');
          if(k&&c)o[k]=c.value.trim();
        });
        return o;
      };
      var dados=readPanel('dados');
      var endereco=readPanel('endereco');
      var adicionais=readPanel('adicionais');
      var name=dados['Nome / Razão Social']||'';
      if(!name){
        var firstInput=document.querySelector('#dados input:not([type=checkbox])');
        name=firstInput?firstInput.value.trim():'';
      }
      if(!name){
        alert('Informe o Nome / Razão Social.');
        return;
      }
      var all=[];
      try{all=JSON.parse(localStorage.getItem('piremaxx_contatos')||'[]')}catch(err){all=[]}
      var old=editKey&&all.find(function(item){return String(item.nome).trim()===String(editKey).trim()||String(item.id)===String(editKey)});
      var types=old&&Array.isArray(old.tipos)&&old.tipos.length?(old.tipos.includes(tipo)?old.tipos:[tipo].concat(old.tipos)):[tipo];
      var entregas=[].slice.call(document.querySelectorAll('.delivery-form')).map(function(f){
        var o={};
        f.querySelectorAll('input,select,textarea').forEach(function(x){if(x.name)o[x.name]=x.value});
        return o;
      });
      var controls=function(id){return [].slice.call(document.querySelectorAll('#'+id+' input:not([type=checkbox]),#'+id+' select,#'+id+' textarea')).map(function(x){return x.value})};
      var record={
        id:(old&&old.id)||Date.now(),
        nome:name,
        tipos:types,
        telefone:dados['Telefone(s)']||'',
        cidade:endereco['Cidade']||(old&&old.cidade)||'',
        uf:endereco['Estado']||(old&&old.uf)||'',
        dados:dados,
        endereco:endereco,
        adicionais:adicionais,
        snap:{dados:controls('dados'),endereco:controls('endereco'),adicionais:controls('adicionais')},
        entregas:entregas
      };
      all=old?all.map(function(item){return String(item.id)===String(old.id)?record:item}):all.concat(record);
      localStorage.setItem('piremaxx_contatos',JSON.stringify(all));
      if(window.piremaxxAudit){
        window.piremaxxAudit.log({
          module:'Contatos',
          action:(old?'Editou ':'Novo ')+tipo,
          detail:name,
          value:tipo.toUpperCase()
        });
      }
      location.href='clientes.html#'+meta.hash;
    },true);
  });
})();
</script>

<script>
// Handler definitivo de carregamento e salvamento (local + online) para Clientes, Fornecedores, Transportadoras e Vendedores
(function(){
  function getContacts(){
    let list=[];
    try{list=JSON.parse(localStorage.getItem('piremaxx_contatos')||'[]')}catch(e){list=[]}
    let dedicated=[];
    try{dedicated=JSON.parse(localStorage.getItem('piremaxx_fornecedores')||'[]')}catch(e){dedicated=[]}
    dedicated.forEach(function(sup){
      const nome=String(sup.nome||sup.name||'').trim();
      if(!nome)return;
      if(!list.some(function(c){return String(c.id||'')===String(sup.id||'')||String(c.nome||'').trim().toLowerCase()===nome.toLowerCase()})){
        list.push(Object.assign({},sup,{nome:nome,tipos:Array.isArray(sup.tipos)&&sup.tipos.length?sup.tipos:['fornecedor']}));
      }
    });
    return list;
  }

  function restoreEditTypes(){
    const params=new URLSearchParams(location.search);
    const editKey=params.get('edit');
    const tipoParam=params.get('tipo')||(!editKey?localStorage.getItem('piremaxx_last_contact_tab'):null);
    const all=getContacts();
    const existing=editKey?all.find(function(x){return String(x.nome||'').trim()===String(editKey).trim()}):null;
    const targetTipos=tipoParam?[tipoParam]:(existing&&Array.isArray(existing.tipos)&&existing.tipos.length?existing.tipos:['cliente']);
    const box=document.querySelector('.contact-types');
    if(box){
      box.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
        cb.checked=targetTipos.includes(cb.value);
      });
    }
    const head=document.querySelector('.client-form-head');
    if(head){
      const mainTipo=targetTipos[0]||'cliente';
      const labelMap={cliente:'cliente',fornecedor:'fornecedor',transportador:'transportadora',vendedor:'vendedor',comprador:'comprador'};
      head.textContent=(editKey?'Editar ':'Novo ')+(labelMap[mainTipo]||'contato');
    }
  }

  document.addEventListener('DOMContentLoaded',function(){
    restoreEditTypes();
    setTimeout(restoreEditTypes,200);
    setTimeout(restoreEditTypes,600);
    setTimeout(restoreEditTypes,1700);
  });

  document.addEventListener('click',async function(e){
    const btn=e.target.closest&&e.target.closest('.actions .save');
    if(!btn)return;
    e.preventDefault();
    e.stopImmediatePropagation();

    const params=new URLSearchParams(location.search);
    const editKey=params.get('edit');
    const tipoParam=params.get('tipo')||(!editKey?localStorage.getItem('piremaxx_last_contact_tab'):null);

    const readField=function(panelId,labelPart){
      const fields=[...document.querySelectorAll('#'+panelId+' .field')];
      const f=fields.find(function(item){return item.textContent.toLowerCase().includes(labelPart.toLowerCase())});
      if(!f)return '';
      const input=f.querySelector('input:not([type="checkbox"]),select,textarea');
      return input?input.value.trim():'';
    };

    const name=readField('dados','Nome / Razão Social');
    if(!name){
      alert('Informe o Nome / Razão Social.');
      return;
    }

    const all=getContacts();
    const old=editKey?all.find(function(item){return String(item.nome||'').trim()===String(editKey).trim()}):null;

    let tipos=[...document.querySelectorAll('.contact-types input[type="checkbox"]:checked')].map(function(x){return x.value});
    if(tipoParam&&!tipos.includes(tipoParam))tipos=[tipoParam];
    if(!tipos.length&&old&&Array.isArray(old.tipos)&&old.tipos.length)tipos=old.tipos.slice();
    if(!tipos.length)tipos=['cliente'];

    const controls=function(id){
      return [...document.querySelectorAll('#'+id+' input:not([type="checkbox"]),#'+id+' select,#'+id+' textarea')].map(function(x){return x.value});
    };

    const phones=[...document.querySelectorAll('#dados input[name="telefone"], #dados input')].filter(function(inp){
      const lbl=inp.closest('.field');
      return lbl&&lbl.textContent.toLowerCase().includes('telefone');
    }).map(function(x){return x.value.trim()}).filter(Boolean);

    const emails=[...document.querySelectorAll('#dados input[name="email"], #dados input')].filter(function(inp){
      const lbl=inp.closest('.field');
      return lbl&&lbl.textContent.toLowerCase().includes('e-mail');
    }).map(function(x){return x.value.trim()}).filter(Boolean);

    const entregas=[...document.querySelectorAll('.delivery-form')].map(function(f){
      const o={};
      f.querySelectorAll('input,select,textarea').forEach(function(x){if(x.name)o[x.name]=x.value});
      return o;
    });

    const dadosObj={
      'Nome / Razão Social':name,
      'CPF / CNPJ':readField('dados','CPF / CNPJ'),
      'Nome fantasia':readField('dados','Nome fantasia'),
      'Nome do contato':readField('dados','Nome do contato'),
      'Telefone(s)':phones[0]||readField('dados','Telefone'),
      'E-mail(s)':emails[0]||readField('dados','E-mail')
    };

    const enderecoObj={
      'CEP':readField('endereco','CEP'),
      'Estado':readField('endereco','Estado'),
      'Cidade':readField('endereco','Cidade'),
      'Endereço':readField('endereco','Endereço'),
      'Número':readField('endereco','Número'),
      'Complemento':readField('endereco','Complemento'),
      'Bairro':readField('endereco','Bairro')
    };

    const adicionaisObj={
      'Indicador de IE':readField('adicionais','Indicador de IE'),
      'Inscrição Estadual':readField('adicionais','Inscrição Estadual'),
      'IE Subst. Trib.':readField('adicionais','IE Subst'),
      'Inscrição Municipal':readField('adicionais','Inscrição Municipal'),
      'Suframa':readField('adicionais','Suframa'),
      'Ente governamental':readField('adicionais','Ente governamental'),
      'Data nascimento':readField('adicionais','Data nascimento'),
      'Palavras-chave':readField('adicionais','Palavras-chave'),
      'Observações':readField('adicionais','Observações')
    };

    const recordId=old?.id||Date.now();
    const obj={
      id:recordId,
      code:String(recordId),
      nome:name,
      name:name,
      tipos:tipos,
      tipo:tipos[0]||'cliente',
      cpfcnpj:dadosObj['CPF / CNPJ'],
      fantasia:dadosObj['Nome fantasia'],
      contato:dadosObj['Nome do contato'],
      telefone:dadosObj['Telefone(s)']||'',
      telefones:phones,
      email:dadosObj['E-mail(s)']||'',
      emails:emails,
      uf:enderecoObj['Estado']||'',
      cidade:enderecoObj['Cidade']||'',
      dados:dadosObj,
      endereco:enderecoObj,
      adicionais:adicionaisObj,
      snap:{
        dados:controls('dados'),
        endereco:controls('endereco'),
        adicionais:controls('adicionais')
      },
      entregas:entregas,
      updatedAt:new Date().toISOString()
    };

    const updatedList=old
      ?all.map(function(item){return (item.id===old.id||String(item.nome||'').trim()===String(editKey).trim())?obj:item})
      :all.concat(obj);

    localStorage.setItem('piremaxx_contatos',JSON.stringify(updatedList));

    const suppliers=updatedList.filter(function(c){
      const t=Array.isArray(c.tipos)?c.tipos:[];
      return t.includes('fornecedor')||String(c.tipo||'').toLowerCase()==='fornecedor';
    });
    localStorage.setItem('piremaxx_fornecedores',JSON.stringify(suppliers));

    if(typeof window.piremaxxSyncOnline==='function'){
      try{
        await Promise.all([
          window.piremaxxSyncOnline('piremaxx_contatos',JSON.stringify(updatedList)),
          window.piremaxxSyncOnline('piremaxx_fornecedores',JSON.stringify(suppliers))
        ]);
      }catch(err){}
    }

    const firstTipo=tipoParam||tipos[0]||'cliente';
    const dest={
      cliente:'clientes',
      fornecedor:'fornecedores',
      comprador:'compradores',
      transportador:'transportadores',
      vendedor:'vendedores'
    }[firstTipo]||'clientes';
    location.href='clientes.html#'+dest;
  },true);
})();
</script>
