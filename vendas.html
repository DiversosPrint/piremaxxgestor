<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendas (produtos e serviços)</title><link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0f4;color:#536878;font:12px Arial,Helvetica,sans-serif}.app-head{height:65px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #d7dce0}.search{display:flex;width:360px;height:44px}.search input{flex:1;border:1px solid #d7d7d7;padding:0 13px;color:#78909c;font-size:13px}.search button{width:90px;border:0;background:#08bdb5;color:#fff;font-size:20px;font-weight:bold}.identity{text-align:right;line-height:1.45;color:#71828d;font-size:13px}.identity strong{display:block;color:#334d5b;font-size:14px}.avatar{display:inline-flex;vertical-align:middle;margin-left:12px;width:42px;height:42px;border-radius:50%;background:linear-gradient(#fff,#cfcfcf);border:1px solid #ddd;align-items:center;justify-content:center;color:#555;font-size:20px}.page-head{height:65px;background:#6a8d9c;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.page-head h1{font-size:20px;font-weight:400;margin:0}.page-head-actions{display:flex;gap:14px}.top-btn{border:0;border-radius:4px;padding:11px 17px;color:#fff;font-weight:bold;cursor:pointer}.tutorial{background:#f2ad38}.top-new{background:#08d887}.content{margin:30px 15px;background:#fff;border:1px solid #dce0e2;box-shadow:0 1px 2px #d9dddf}.tabs{display:flex;border-bottom:1px solid #18a59f;background:#f4f5f6}.tabs button{height:48px;border:0;border-right:5px solid #fff;background:#5a7b89;color:#fff;padding:0 22px;font-weight:bold;font-size:13px;cursor:pointer}.tabs button.active{background:#1ba39d}.filterbar{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 16px;border-bottom:1px solid #e0e0e0;min-height:78px}.left-actions,.right-actions{display:flex;align-items:center;gap:7px}.tool{height:37px;min-width:38px;border:1px solid #c9ced2;border-radius:4px;background:#fafafa;color:#5d6c74;font-size:16px;cursor:pointer}.new-sale{height:37px;border:0;border-radius:4px;background:#2fb46a;color:#fff;padding:0 18px;font-size:14px;font-weight:bold;cursor:pointer}.monthbar{display:flex;align-items:center;gap:8px;color:#65747c}.monthbar button{height:37px;border:1px solid #d0d5d7;background:#fff;border-radius:4px;color:#87949a;padding:0 12px;cursor:pointer}.monthbar .month{min-width:135px;text-align:center;font-size:13px}.list-wrap{overflow-x:auto}.list{width:100%;border-collapse:collapse;min-width:850px}.list th{height:43px;color:#526c7e;text-align:left;font-size:13px;border-bottom:1px solid #dfe3e5;padding:0 14px;white-space:nowrap}.list td{height:42px;border-bottom:1px solid #fff;padding:0 14px;color:#53708b;white-space:nowrap}.list tbody tr:nth-child(odd){background:#f0f0f0}.list tbody tr:hover{background:#e5f4f3}.check{width:20px;height:20px;accent-color:#199e98}.amount{text-align:right}.open{border:0;background:transparent;color:#337daa;cursor:pointer;font-size:12px}.list-footer{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;color:#76858b;border-top:1px solid #e0e4e6}.pager{display:flex;gap:4px}.pager button{border:1px solid #ccd2d5;background:#fff;color:#52758d;border-radius:3px;padding:6px 10px;cursor:pointer}.pager button.active{background:#2b9c98;color:#fff}.editor{display:none;background:#fff;min-height:calc(100vh - 65px);padding:0 2.8% 25px}.editor.show{display:block}.editor-mode{padding-left:0!important;background:#fff}.editor-mode .pire-sidebar,.editor-mode .app-head,.editor-mode .page-head{display:none}.editor-top{height:35px;background:#249997;color:#fff;display:flex;align-items:center;padding:0 10px;font-weight:bold}.attach{margin-left:auto;background:#f7f7f7;color:#555;border-radius:3px;padding:8px 13px;font-weight:normal}.edit-body{padding-top:35px}.box{background:#eee;border:1px solid #ddd;padding:20px 45px;margin-bottom:18px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px 20px}.field label{display:block;margin:0 0 5px;color:#6d767b}.field input,.field select,.field textarea{width:100%;height:27px;border:1px solid #c8cdd0;background:#fff;padding:4px 8px;color:#557084;border-radius:2px}.field textarea{height:44px}.section-title{font-size:13px;color:#627482;margin:15px 0 10px}.cart-wrap{overflow-x:auto}.cart{width:100%;border-collapse:collapse;min-width:900px}.cart th{height:29px;text-align:left;background:#d9d9d9;padding:0 12px;color:#557083;font-weight:normal}.cart td{padding:7px 12px;background:#eee;border-bottom:8px solid #fff;color:#587288;vertical-align:middle}.cart td small{display:block;margin-top:4px;color:#6a777d}.cart input,.cart select{height:25px;width:100%;border:1px solid #c8cdd0;background:#fff;padding:3px 7px;color:#587288}.cart .iname{min-width:300px}.line{text-align:right;min-width:100px}.remove{border:0;background:#df5957;color:#fff;border-radius:3px;padding:6px 9px;cursor:pointer}.add{border:0;background:#1f9b96;color:#fff;padding:8px 14px;margin:6px 0 14px;border-radius:3px;cursor:pointer}.total{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;background:#d9d9d9;padding:12px 18px;color:#557083;font-weight:bold}.total span:nth-child(n+3){text-align:right}.notes{max-width:890px;margin:7px 10px 28px}.actions{display:flex;align-items:center;gap:7px;border-top:1px solid #e5e5e5;padding-top:14px;margin-top:28px}.btn{border:0;border-radius:3px;padding:10px 14px;color:#fff;font-weight:bold;cursor:pointer}.gray{background:#747474}.blue{background:#168bc1}.cyan{background:#12b8af}.green{background:#2ca661}.right{margin-left:auto}.empty{padding:28px!important;text-align:center!important;color:#778!important}@media(max-width:850px){.grid{grid-template-columns:1fr}.box{padding:15px}.filterbar{align-items:flex-start;gap:15px;flex-direction:column}.left-actions,.right-actions{width:100%;flex-wrap:wrap}.total{grid-template-columns:1fr 1fr}.right{margin-left:0}}
</style></head>
<body><style>body{display:block}</style>
<header class="app-head"><div class="search"><input placeholder="em:vendas"><button>⌕</button></div><div class="identity"><strong>ODIMAN COSTA</strong>DNFX - COMERCIO DE PNEUS <span class="avatar">◕</span>⌄</div></header>
<header class="page-head"><h1>Vendas ( produtos e serviços )</h1><div class="page-head-actions"><button class="top-btn tutorial">▦ Tutoriais</button><button class="top-btn top-new" onclick="startNew()">⊞ Novo⌄</button></div></header>
<main class="content" id="listView"><div class="tabs"><button class="active">▦ VENDAS</button><button>↪ DEVOLUÇÕES</button></div><div class="filterbar"><div class="left-actions"><button class="new-sale" onclick="startNew()">↪ Nova</button><button class="tool" onclick="cloneSelected()">▧</button><button class="tool" onclick="emitNfe()">▣</button><button class="tool" onclick="deleteSelected()">▥</button><button class="tool" onclick="changeStatus()">↻</button><button class="tool" onclick="alert('Selecione uma venda para enviar pelo WhatsApp.')">◉</button><button class="tool" onclick="window.printSalesReport()">▤</button></div><div class="right-actions"><div class="monthbar"><button onclick="changeMonth(-1)">‹</button><button class="month" id="monthLabel">Setembro 2026</button><button onclick="changeMonth(1)">›</button><button onclick="setCurrentMonth()">Mês Atual</button></div><div class="search"><input id="search" placeholder="Buscar vendas"><button onclick="renderList()">⌕</button></div></div></div><div class="list-wrap"><table class="list"><thead><tr><th style="width:45px"><input class="check" type="checkbox" onchange="toggleAll(this)"></th><th>Cód</th><th>Cliente</th><th>Vendedor</th><th>Data</th><th>Tipo</th><th class="amount">Total</th></tr></thead><tbody id="salesRows"></tbody></table></div><footer class="list-footer"><span id="listSummary">0 registros encontrados</span><span id="listTotal">TOTAL LISTADO R$ 0,00</span><div class="pager"><button onclick="page(-1)">‹</button><button class="active">1</button><button onclick="page(1)">›</button></div></footer></main>
<main class="editor" id="editor">
<div class="editor-top"><button class="btn gray" onclick="showList()">← Voltar</button><strong id="docTitle" style="margin-left:12px">Orçamento novo</strong></div>
<div class="edit-body"><div class="box"><div class="grid"><div class="field"><label>Cliente</label><input id="customerInput" list="clientOptions" placeholder="Nome do cliente"></div><div class="field"><label>Tipo</label><select id="kind"><option>Venda</option><option>Orçamento</option></select></div><div class="field"><label>Data</label><input id="date" type="date"></div><div class="field"><label>Vendedor</label><select id="seller"></select></div><div class="field"><label>Consumidor final</label><select id="finalConsumer"><option>Não</option><option>Sim</option></select></div><div class="field"><label>Palavras-chave</label><input id="tags"></div></div></div>
<div class="box"><div class="section-title">Itens da venda</div><div class="cart-wrap"><table class="cart"><thead><tr><th>Produto/serviço</th><th>Preço</th><th>Quantidade</th><th></th><th>Total</th><th></th></tr></thead><tbody id="items"></tbody></table></div><button class="add" onclick="addItem()">+ Adicionar item</button><div class="total"><span>Quantidade</span><span id="qtyTotal">0</span><span>Total</span><span id="grand">R$ 0,00</span></div></div>
<div class="box"><div class="grid"><div class="field"><label>Status financeiro</label><select id="paymentStatus"><option>A receber</option><option>Recebido</option></select></div><div class="field"><label>Forma de pagamento</label><select id="payment"><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Boleto</option></select></div><div class="field"><label>Data de pagamento</label><input id="paydate" type="date"></div><div class="field"><label>Valor da parcela</label><input id="installment" type="number" step="0.01"></div><div class="field"><label>Total financeiro</label><strong id="finTotal">R$ 0,00</strong></div></div><div class="field notes"><label>Observações</label><textarea id="notes"></textarea></div></div><div class="actions"><button class="btn gray" onclick="showList()">Cancelar</button><button class="btn green right" onclick="saveSale()">Salvar venda</button></div></div></main>
<style>.editor-mode .pire-sidebar{display:block}</style><datalist id="clientOptions"></datalist><datalist id="productOptions"></datalist><script src="vendas.js"></script></body></html>
