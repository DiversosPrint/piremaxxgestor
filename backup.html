<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backup | Piremaxx Gestor</title><link rel="stylesheet" href="styles.css"><style>.box{max-width:850px;margin:30px auto}.drop{border:2px dashed #b6cbe2;background:#fff;border-radius:10px;padding:38px;text-align:center}.status{margin-top:18px;padding:14px;border-radius:7px;background:#eef7f3;color:#187a5d;display:none}.status.error{background:#fff0f0;color:#b43333}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.select{padding:11px;border:1px solid var(--line);border-radius:7px;background:#fff}</style></head><body><main class="box"><header><div><p class="eyebrow">Piremaxx Gestor</p><h1>Backup e restauração</h1></div><a class="primary" href="index.html">Voltar</a></header><section class="card"><h2>Backup completo</h2><p class="muted">Clientes, produtos, vendas, compras, financeiro, usuários e configurações.</p><div class="actions"><button class="primary" onclick="downloadBackup()">Baixar backup JSON</button><a class="ghost" href="/api/clients.csv">Clientes CSV ↓</a><a class="ghost" href="/api/products.csv">Produtos CSV ↓</a><a class="ghost" href="/api/sales.csv">Vendas CSV ↓</a></div><hr><h2>Restaurar backup JSON</h2><div class="drop"><input id="jsonFile" type="file" accept="application/json,.json"><br><button class="primary" style="margin-top:18px" onclick="restoreJson()">Validar e restaurar JSON</button></div><hr><h2>Importar arquivo CSV</h2><p class="muted">Use arquivos CSV exportados por planilhas ou pelo eGestor.</p><div class="drop"><select id="resource" class="select"><option value="clients">Clientes</option><option value="products">Produtos</option><option value="sales">Vendas</option><option value="purchases">Compras</option><option value="finance">Financeiro</option></select><input id="csvFile" type="file" accept="text/csv,.csv"><br><button class="primary" style="margin-top:18px" onclick="importCsv()">Validar e importar CSV</button></div><div id="status" class="status"></div></section></main><script>async function downloadBackup(){let r=await fetch('/api/backup'),b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='piremaxx-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}function show(t,err){let s=document.querySelector('#status');s.textContent=t;s.className='status'+(err?' error':'');s.style.display='block'}async function restoreJson(){let f=jsonFile.files[0];if(!f)return show('Selecione um JSON.',true);try{let x=JSON.parse(await f.text());if(!x||typeof x!=='object'||!['clients','products','sales','finance'].some(k=>Array.isArray(x[k])))throw Error('Formato inválido');if(!confirm('A restauração substituirá os dados atuais. Continuar?'))return;let r=await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});if(!r.ok)throw Error('Servidor recusou o backup');show('Backup JSON restaurado com sucesso.')}catch(e){show(e.message,true)}}async function importCsv(){let f=csvFile.files[0];if(!f)return show('Selecione um CSV.',true);try{let text=await f.text();if(!text.includes(';')&&!text.includes(','))throw Error('CSV sem separador reconhecido');let r=await fetch('/api/import/csv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource:resource.value,csv:text})});let x=await r.json();if(!r.ok)throw Error(x.error||'Falha na importação');show(`${x.count} registros importados para ${resource.value}.`)}catch(e){show(e.message,true)}}</script></body></html>
