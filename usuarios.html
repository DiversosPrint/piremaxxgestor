<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Usuários | Piremaxx Gestor</title><style>body{font:14px Arial;margin:0;background:#eef0f4;color:#536878}.page{margin:35px auto;max-width:760px;background:#fff;padding:24px;border:1px solid #ddd}h1{font-weight:normal}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:flex;flex-direction:column;gap:5px}.form input{padding:10px;border:1px solid #ccd4dc}.full{grid-column:1/-1}.button{background:#2ca661;color:#fff;border:0;padding:10px 16px;border-radius:3px;cursor:pointer}.table{width:100%;margin-top:25px;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.delete{background:#df5957;color:#fff;border:0;padding:6px 10px;border-radius:3px;cursor:pointer}@media(max-width:600px){.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="page"><h1>Usuários</h1><form id="form" class="form"><label>Nome<input id="name" required></label><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="password" type="password" minlength="4" required></label><label>Confirmar senha<input id="confirm" type="password" minlength="4" required></label><div class="full"><button class="button">Cadastrar usuário</button></div></form><p id="message"></p><table class="table"><thead><tr><th>Nome</th><th>E-mail</th><th></th></tr></thead><tbody id="rows"></tbody></table></main><script>const $=id=>document.getElementById(id);async function load(){const r=await fetch('/api/users');const users=await r.json();$('rows').innerHTML=users.map(u=>'<tr><td>'+u.name+'</td><td>'+u.email+'</td><td><button class="delete" data-id="'+u.id+'">Excluir</button></td></tr>').join('');document.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(confirm('Excluir usuário?')){await fetch('/api/users/'+b.dataset.id,{method:'DELETE'});load()}})}$('form').onsubmit=async e=>{e.preventDefault();if($('password').value!==$('confirm').value){$('message').textContent='As senhas não conferem.';return}const r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value})});const d=await r.json();$('message').textContent=r.ok?'Usuário cadastrado.':d.error; if(r.ok){e.target.reset();load()}};load()</script></body></html>
