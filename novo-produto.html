<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão Piremaxx - Novo produto</title>
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#526e7b;font:12px Arial,sans-serif}.product-page{margin-left:143px;min-height:100vh;padding-top:42px}.product-top{position:fixed;z-index:40;left:143px;right:0;top:0;height:43px;background:#18a99f;color:#fff;padding:14px 12px;font-size:14px;font-weight:bold}.product-top .attachment{float:right;background:#fff;color:#54636a;padding:8px 12px;margin-top:-14px;height:43px;font-weight:normal}.product-top .close{float:right;margin:0 10px;color:#087d78;font-size:16px}.product-body{padding:40px 64px 70px}.product-tabs{display:flex;height:42px;border:2px solid #ddd;border-radius:4px;background:#eee;margin-bottom:16px}.product-tabs button{flex:1;border:0;background:transparent;color:#08a9a8;font-weight:bold}.product-tabs button.active{margin:5px;background:#19a99f;color:#fff;border-radius:3px}.box{background:#eee;border:1px solid #e0e0e0;border-radius:4px;padding:28px 32px;margin-bottom:20px}.box h3{font-size:14px;font-weight:normal;color:#5b7d8a;margin:0 0 26px}.grid-main{display:grid;grid-template-columns:1.55fr 1fr 1.45fr;gap:16px 24px}.grid-main .name{grid-column:1 / span 2}.field{position:relative}.field label{display:block;margin-bottom:5px;color:#55707c}.field input,.field textarea,.field select{width:100%;height:28px;border:1px solid #c9d0d3;border-radius:3px;background:#fff;padding:0 10px;color:#55707c}.field input:focus,.field textarea:focus{outline:1px solid #11aaa8;border-color:#11aaa8}.combo{display:flex}.combo input{border-radius:3px 0 0 3px}.combo button{width:34px;border:1px solid #c9d0d3;border-left:0;border-radius:0 3px 3px 0;background:#f7f7f7;color:#526e7b;cursor:pointer}.combo-menu{position:absolute;z-index:70;left:0;right:0;top:48px;background:#fff;border:1px solid #aaa;box-shadow:0 3px 8px #0002;max-height:180px;overflow:auto}.combo-menu button{display:block;width:100%;height:30px;border:0;background:#fff;text-align:left;padding:0 10px;color:#526e7b}.combo-menu button:hover,.combo-menu button.selected{background:#2776c9;color:#fff}.edit-category{margin-left:5px;border:1px solid #bbb;background:#fafafa;border-radius:3px;color:#526e7b;font-size:11px;padding:2px 6px}.switch{height:28px;background:#ddd;border:1px solid #c8c8c8;border-radius:4px;position:relative;cursor:pointer;text-align:center;line-height:26px;color:#66747a}.switch.on{background:#377fb9;color:#fff}.switch i{position:absolute;right:2px;top:2px;width:10px;height:22px;background:#fff;border-radius:2px}.switch.off i{left:2px;right:auto}.money{display:flex}.money span{width:29px;height:28px;border:1px solid #c9d0d3;border-radius:3px 0 0 3px;text-align:center;line-height:26px}.money input{border-radius:0 3px 3px 0}.stock-grid{display:grid;grid-template-columns:140px 1.5fr 1.5fr;gap:24px;align-items:end}.notes{margin:0 12px 18px}.notes textarea{height:44px;resize:vertical}.footer-actions{position:fixed;z-index:50;bottom:0;left:143px;right:0;height:57px;background:#fff;border-top:1px solid #ddd;text-align:right;padding:12px 64px}.footer-actions button{height:31px;border:0;border-radius:3px;padding:0 16px;margin-left:5px}.save{background:#35a858;color:#fff;font-weight:bold}.back{background:#e5e5e5;color:#666}.hidden{display:none!important}@media(max-width:900px){.product-body{padding:40px 22px 70px}.grid-main{grid-template-columns:1fr 1fr}.grid-main .name{grid-column:1 / -1}.stock-grid{grid-template-columns:1fr 1fr}.product-page{margin-left:143px}}
</style>
<style>.category-modal{position:fixed;z-index:100;inset:0;background:#0005;display:flex;align-items:flex-start;justify-content:center;padding-top:8px}.category-dialog{width:480px;background:#fff;border-radius:4px;box-shadow:0 3px 12px #0006;overflow:hidden}.category-dialog header{height:42px;background:#df5755;color:#fff;font-weight:bold;font-size:14px;padding:13px}.category-dialog header button{float:right;border:0;background:transparent;color:#a72d2d;font-size:18px;line-height:14px}.category-list{padding:12px 42px 25px;color:#777}.category-list>div{height:38px;display:flex;align-items:center;gap:5px}.category-delete{width:28px;height:30px;border:0;border-radius:3px;background:#df5755;color:#fff}.category-pick{border:0;background:transparent;color:#777;font-size:12px;padding:0}.category-pick:hover{color:#2677b4;text-decoration:underline}.category-list span{font-size:12px}.category-dialog footer{border-top:1px solid #eee;text-align:right;padding:12px}.category-dialog footer button{border:1px solid #ddd;border-radius:3px;padding:6px 12px;color:#666}</style>
</head>
<body><aside class="sidebar"></aside><main class="product-page">
<header class="product-top">Novo produto <span class="close">×</span><span class="attachment">⌕ Nenhum arquivo anexado</span></header>
<section class="product-body"><nav class="product-tabs"><button class="active">DADOS DO PRODUTO</button><button>DADOS FISCAIS</button><button>FOTOS / INTEGRAÇÃO</button></nav>
<div class="box"><div class="grid-main">
<div class="field name"><label for="productName">Nome</label><input id="productName" autofocus></div><div class="field"><label for="customCode">Código próprio</label><input id="customCode" placeholder="Código personalizado"></div>
<div class="field"><label>Categoria <button class="edit-category" id="editCategory" type="button">editar</button></label><div class="combo"><input id="category" autocomplete="off"><button type="button" data-open="category">⌕</button><div class="combo-menu hidden" id="categoryMenu"></div></div></div>
<div class="field"><label for="keywords">Palavras-chave</label><input id="keywords"></div>
<div class="field"><label for="usage">Tipo de uso</label><select id="usage"><option>Mercadoria para revenda</option><option>Matéria-prima</option><option>Embalagem</option><option>Produto em processo</option><option>Produto final (produção)</option><option>Outros insumos</option><option>Uso e consumo</option></select></div>
<div class="field"><label>Arquivar (ocultar)</label><div class="switch" id="archiveSwitch">Não<i></i></div></div>
</div></div>
<div class="box"><h3>Valores unitários</h3><div class="grid-main"><div class="field"><label>Preço de custo</label><div class="money"><span>$</span><input id="cost" inputmode="decimal"></div></div><div class="field"><label>Preço de venda</label><div class="money"><span>$</span><input id="salePrice" inputmode="decimal"></div></div><div class="field"><label>Margem de contribuição (o que é isso?)</label><div class="money"><span>%</span><input id="margin" inputmode="decimal"></div></div></div></div>
<div class="box"><h3>Estoque</h3><div class="stock-grid"><div class="field"><label>Controlar estoque</label><div class="switch on" id="stockSwitch">Sim<i></i></div></div><div class="field"><label>Estoque Atual</label><div class="combo"><button type="button">☷</button><input id="stock" inputmode="numeric"></div></div><div class="field"><label>Estoque mínimo</label><div class="combo"><button type="button">☷</button><input id="minStock" inputmode="numeric"></div></div></div></div>
<div class="field notes"><label for="notes">Anotações internas</label><textarea id="notes"></textarea></div></section>
<footer class="footer-actions"><button type="button" class="save" id="saveProduct">Salvar</button><button type="button" class="back" id="backProducts">Voltar</button></footer></main>
<script src="vendas-importadas.js?v=produto-form-1"></script><script src="menu-lateral.js?v=produto-form-1"></script>
<script>
(function(){
 const usageOptions=['Mercadoria para revenda','Matéria-prima','Embalagem','Produto em processo','Produto final (produção)','Outros insumos','Uso e consumo'];
 const categories=['TABELA A','TABELA B','TABELA VAREJO','USADOS'];
 function combo(inputId,menuId,options){const input=document.getElementById(inputId),menu=document.getElementById(menuId);function draw(){const q=input.value.toLowerCase();menu.innerHTML=options.filter(x=>x.toLowerCase().includes(q)).map(x=>'<button type="button">'+x+'</button>').join('')||'<span style="display:block;padding:10px;color:#888">Nenhuma opção encontrada</span>';menu.classList.remove('hidden')}input.addEventListener('focus',draw);input.addEventListener('input',draw);document.querySelector('[data-open="'+inputId+'"]')?.addEventListener('click',()=>menu.classList.toggle('hidden'));menu.addEventListener('click',e=>{if(e.target.tagName==='BUTTON'){input.value=e.target.textContent;menu.classList.add('hidden')}});document.addEventListener('click',e=>{if(!e.target.closest('#'+inputId+',#'+menuId+' ,[data-open="'+inputId+'"]'))menu.classList.add('hidden')})}
 combo('category','categoryMenu',categories);
 const categoryEditor=document.querySelector('.edit-category');
 categoryEditor.addEventListener('click',function(){let modal=document.getElementById('categoryModal');if(modal){modal.classList.remove('hidden');return}modal=document.createElement('div');modal.id='categoryModal';modal.className='category-modal';modal.innerHTML='<div class="category-dialog"><header>Categorias cadastradas <button type="button" class="category-close">×</button></header><div class="category-list">'+categories.map(function(name){return '<div><button type="button" class="category-delete" aria-label="Excluir">▣</button><button type="button" class="category-pick">'+name+'</button><span>(0 produtos cadastrados)</span></div>}).join('')+'</div><footer><button type="button" class="category-close">Fechar</button></footer></div>';document.body.appendChild(modal);modal.querySelectorAll('.category-close').forEach(function(b){b.onclick=function(){modal.classList.add('hidden')}});modal.querySelectorAll('.category-pick').forEach(function(b){b.onclick=function(){document.getElementById('category').value=b.textContent;modal.classList.add('hidden')}})});
 function toggle(id,on,onText,offText){const el=document.getElementById(id);el.addEventListener('click',()=>{el.classList.toggle('on');el.classList.toggle('off');el.firstChild.textContent=el.classList.contains('on')?onText:offText})}toggle('archiveSwitch',true,'Não','Sim');toggle('stockSwitch',true,'Sim','Não');
 document.querySelectorAll('.product-tabs button').forEach((b,i)=>b.addEventListener('click',()=>{if(i){alert('Esta aba será implementada na próxima etapa.')}}));
 document.getElementById('backProducts').onclick=()=>location.href='produtos.html';
 document.getElementById('saveProduct').onclick=function(){const name=document.getElementById('productName').value.trim();if(!name){document.getElementById('productName').focus();alert('Informe o nome do produto.');return}const saved=JSON.parse(localStorage.getItem('localProducts')||'[]');saved.unshift({code:document.getElementById('customCode').value||String(Date.now()).slice(-6),name,category:document.getElementById('category').value,type:'Produto',usage:document.getElementById('usage').value,price:Number(document.getElementById('salePrice').value.replace(',','.'))||0,stock:Number(document.getElementById('stock').value)||0,cost:Number(document.getElementById('cost').value.replace(',','.'))||0,keywords:document.getElementById('keywords').value,notes:document.getElementById('notes').value,archived:document.getElementById('archiveSwitch').classList.contains('on')===false});localStorage.setItem('localProducts',JSON.stringify(saved));location.href='produtos.html'};
})();
</script><script>
/* Reforça os seletores pesquisáveis: o clique no ícone deve abrir o menu antes do fechamento global. */
(function(){['category','usage'].forEach(function(id){var input=document.getElementById(id),menu=document.getElementById(id==='category'?'categoryMenu':'usageMenu'),trigger=document.querySelector('[data-open="'+id+'"]');if(!input||!menu||!trigger)return;var options=id==='usage'?['Mercadoria para revenda','Matéria-prima','Embalagem','Produto em processo','Produto final (produção)','Outros insumos','Uso e consumo']:[...new Set((window.cloneData?.products||[]).map(function(p){return p.category}).filter(Boolean))];if(!options.length)options=['Pneus','Serviços','Peças','Outros'];function open(){var q=(input.value||'').toLowerCase();menu.innerHTML=options.filter(function(x){return x.toLowerCase().includes(q)}).map(function(x){return '<button type="button">'+x+'</button>'}).join('')||'<span style="display:block;padding:10px;color:#888">Nenhuma opção encontrada</span>';menu.classList.remove('hidden')}trigger.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();open()},true);input.addEventListener('focus',open);input.addEventListener('input',open);menu.addEventListener('click',function(e){if(e.target.tagName==='BUTTON'){input.value=e.target.textContent;menu.classList.add('hidden')}e.stopPropagation()})})})();
</script><script>
(function(){var trigger=document.querySelector('[data-open="category"]'),menu=document.getElementById('categoryMenu'),input=document.getElementById('category');if(!trigger||!menu)return;trigger.addEventListener('click',function(){setTimeout(function(){menu.innerHTML=['TABELA A','TABELA B','TABELA VAREJO','USADOS'].map(function(x){return '<button type="button">'+x+'</button>'}).join('');menu.classList.remove('hidden')},0)},true);menu.addEventListener('click',function(e){if(e.target.tagName==='BUTTON')input.value=e.target.textContent},true)})();
</script><script>
document.getElementById('editCategory').addEventListener('click',function(){var modal=document.getElementById('categoryModal');if(!modal){modal=document.createElement('div');modal.id='categoryModal';modal.className='category-modal';modal.innerHTML='<div class="category-dialog"><header>Categorias cadastradas <button type="button" class="category-close">×</button></header><div class="category-list">'+['TABELA A','TABELA B','TABELA VAREJO','USADOS'].map(function(x){return '<div><button type="button" class="category-delete">▣</button><button type="button" class="category-pick">'+x+'</button><span>(0 produtos cadastrados)</span></div>'}).join('')+'</div><footer><button type="button" class="category-close">Fechar</button></footer></div>';document.body.appendChild(modal);modal.querySelectorAll('.category-close').forEach(function(b){b.onclick=function(){modal.classList.add('hidden')}});modal.querySelectorAll('.category-pick').forEach(function(b){b.onclick=function(){document.getElementById('category').value=b.textContent;modal.classList.add('hidden')}})}modal.classList.remove('hidden')});
</script><script>
(function(){var trigger=document.querySelector('[data-open="usage"]'),menu=document.getElementById('usageMenu'),input=document.getElementById('usage'),options=['Mercadoria para revenda','Matéria-prima','Embalagem','Produto em processo','Produto final (produção)','Outros insumos','Uso e consumo'];if(!trigger||!menu)return;function showAll(){menu.innerHTML=options.map(function(x){return '<button type="button">'+x+'</button>'}).join('');menu.classList.remove('hidden')}trigger.addEventListener('click',function(){setTimeout(showAll,25)});menu.addEventListener('mousedown',function(e){if(e.target.tagName==='BUTTON'){e.preventDefault();input.value=e.target.textContent;menu.classList.add('hidden')}} ,true)})();
</script><script>
(function(){var button=document.getElementById('saveProduct');if(!button)return;button.onclick=function(){var name=document.getElementById('productName').value.trim();if(!name){alert('Informe o nome do produto.');document.getElementById('productName').focus();return}var saved=[];try{var raw=localStorage.getItem('localProducts');var parsed=raw?JSON.parse(raw):[];saved=Array.isArray(parsed)?parsed:[]}catch(e){saved=[]}saved.unshift({code:document.getElementById('customCode').value.trim()||String(Date.now()).slice(-6),name:name,category:document.getElementById('category').value, type:'Produto',usage:document.getElementById('usage').value,price:Number((document.getElementById('salePrice').value||'').replace(',','.'))||0,stock:Number(document.getElementById('stock').value)||0,cost:Number((document.getElementById('cost').value||'').replace(',','.'))||0,keywords:document.getElementById('keywords').value,notes:document.getElementById('notes').value,archived:!document.getElementById('archiveSwitch').classList.contains('on')});localStorage.setItem('localProducts',JSON.stringify(saved));window.location.assign('produtos.html')}})();
</script><script>
(function(){var editCode=new URLSearchParams(location.search).get('edit');if(!editCode)return;var all=(window.cloneData?.products||[]),local=[];try{local=JSON.parse(localStorage.getItem('localProducts')||'[]')}catch(e){}var product=local.find(function(x){return String(x.code)===String(editCode)})||all.find(function(x){return String(x.code)===String(editCode)});if(!product)return;document.getElementById('productName').value=product.name||'';document.getElementById('customCode').value=product.code||'';document.getElementById('category').value=product.category||'';document.getElementById('keywords').value=product.keywords||'';document.getElementById('usage').value=product.usage||'Mercadoria para revenda';document.getElementById('cost').value=product.cost||'';document.getElementById('salePrice').value=product.price||'';document.getElementById('stock').value=product.stock??'';document.getElementById('minStock').value=product.minStock??'';document.getElementById('notes').value=product.notes||'';if(product.archived){var archive=document.getElementById('archiveSwitch');archive.classList.remove('on');archive.classList.add('off');archive.firstChild.textContent='Sim'}})();
(function(){var editCode=new URLSearchParams(location.search).get('edit'),button=document.getElementById('saveProduct');if(!editCode||!button)return;var original=button.onclick;button.onclick=function(){original();try{var saved=JSON.parse(localStorage.getItem('localProducts')||'[]'),index=saved.findIndex(function(x){return String(x.code)===String(editCode)});if(index>=0){saved[index].name=document.getElementById('productName').value.trim();saved[index].category=document.getElementById('category').value;saved[index].usage=document.getElementById('usage').value;saved[index].price=Number((document.getElementById('salePrice').value||'').replace(',','.'))||0;saved[index].stock=Number(document.getElementById('stock').value)||0;localStorage.setItem('localProducts',JSON.stringify(saved))}}catch(e){}}})();
</script><script>
(function(){var code=new URLSearchParams(location.search).get('edit'),button=document.getElementById('saveProduct');if(!code||!button)return;button.onclick=function(){var saved=[];try{saved=JSON.parse(localStorage.getItem('localProducts')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){}var item=saved.find(function(x){return String(x.code)===String(code)});if(!item){item={code:code};saved.unshift(item)}item.name=document.getElementById('productName').value.trim();if(!item.name){alert('Informe o nome do produto.');return}item.category=document.getElementById('category').value;item.usage=document.getElementById('usage').value;item.keywords=document.getElementById('keywords').value;item.price=Number((document.getElementById('salePrice').value||'').replace(',','.'))||0;item.cost=Number((document.getElementById('cost').value||'').replace(',','.'))||0;item.stock=Number(document.getElementById('stock').value)||0;item.minStock=Number(document.getElementById('minStock').value)||0;item.notes=document.getElementById('notes').value;item.type='Produto';localStorage.setItem('localProducts',JSON.stringify(saved));location.href='produtos.html'}})();
</script><script>
(function(){['archiveSwitch','stockSwitch'].forEach(function(id){var el=document.getElementById(id);if(!el)return;el.setAttribute('role','switch');el.setAttribute('tabindex','0');el.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();var on=!el.classList.contains('on');el.classList.toggle('on',on);el.classList.toggle('off',!on);if(el.firstChild)el.firstChild.nodeValue=id==='archiveSwitch'?(on?'Não':'Sim'):(on?'Sim':'Não');el.setAttribute('aria-pressed',String(on))},true);el.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();el.click()}})})})();
</script><script>
(function(){var closeButton=document.querySelector('.product-top .close');if(!closeButton)return;closeButton.setAttribute('role','button');closeButton.setAttribute('title','Fechar');closeButton.style.cursor='pointer';closeButton.addEventListener('click',function(){window.location.href='produtos.html'})})();
</script></body></html>
