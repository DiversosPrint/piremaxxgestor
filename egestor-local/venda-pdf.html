<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documento de venda</title><style>body{font:13px Arial;color:#405967;margin:32px}header{display:flex;justify-content:space-between;border-bottom:3px solid #209b98;padding-bottom:16px}.logo{font-size:24px;font-weight:bold;color:#209b98}h2{font-size:15px;color:#506b79;border-bottom:2px solid #209b98;padding-bottom:6px;margin-top:24px}table{width:100%;border-collapse:collapse}th{background:#209b98;color:#fff;text-align:left}td,th{padding:8px;border-bottom:1px solid #d8dee1}.total{text-align:right;font-size:18px;font-weight:bold;margin-top:16px}.print{margin-top:25px;padding:9px 16px;background:#209b98;color:#fff;border:0;border-radius:3px}@media print{.print{display:none}}</style></head><body><div id="doc">Carregando documento...</div><script src="vendas-importadas.js"></script><script>const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const code=new URLSearchParams(location.search).get('code');const saved=JSON.parse(localStorage.getItem('localSales')||'[]').find(x=>String(x.code)===String(code));const source=saved||(window.importedSales||[]).find(x=>String(x.code)===String(code));const s=source||{code:code,client:'',vendor:'',date:'',type:'Venda',total:0,items:[],parts:[]};const rawItems=s.items;const its=Array.isArray(rawItems)?rawItems:rawItems?[rawItems]:[];const parts=s.parts||[];document.getElementById('doc').innerHTML='<header><div class="logo">Gestão Piremaxx</div><div><b>Protocolo:</b> '+s.code+'<br><b>Tipo:</b> '+s.type+'<br><b>Data:</b> '+s.date+'</div></header><h2>Dados da venda</h2><p><b>Cliente:</b> '+s.client+'<br><b>Vendedor:</b> '+(s.vendor||'')+'</p><h2>Itens da venda</h2><table><thead><tr><th>Produto ou serviço</th><th>Preço unitário</th><th>Quantidade</th><th>Total</th></tr></thead><tbody>'+its.map(x=>'<tr><td>'+x.name+'</td><td>'+money(x.price)+'</td><td>'+x.qty+'</td><td>'+money((x.price||0)*(x.qty||0))+'</td></tr>').join('')+'</tbody></table><div class="total">Total: '+money(s.total)+'</div><h2>Financeiro</h2><table><thead><tr><th>Parcela</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody>'+parts.map((x,i)=>'<tr><td>'+(i+1)+'/'+parts.length+'</td><td>'+money((s.total||0)/parts.length)+'</td><td>'+s.date+'</td><td>A receber</td></tr>').join('')+'</tbody></table><button class="print" onclick="window.print()">Imprimir / salvar PDF</button>';</script></body></html>
